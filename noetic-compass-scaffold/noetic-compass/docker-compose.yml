# Noetic Compass — Local Development Stack
# Usage: docker compose up --build

services:
  cas-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NC_JWT_SECRET: ${NC_JWT_SECRET:-change-me-in-production}
      NC_RATE_LIMIT_TIER: ${NC_RATE_LIMIT_TIER:-community}
      NC_DEFAULT_LLM_PROVIDER: ${NC_DEFAULT_LLM_PROVIDER:-mock}
    depends_on:
      - redis
    restart: unless-stopped

  cas-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - cas-api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
