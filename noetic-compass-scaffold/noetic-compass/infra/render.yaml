# Legacy Render Blueprint - Noetic Compass
#
# Prefer the repo-root render.yaml for new Render Blueprint setup. This file is
# kept aligned for anyone who already points Render at this custom path.

services:
  - type: web
    name: noetic-compass-api
    runtime: docker
    rootDir: noetic-compass-scaffold/noetic-compass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health
    # Persistent disk = durable single-host storage for the state ledger + CRM leads.
    # Render disks attach only to PAID instance types (starter/standard/pro), ~$0.25/GB/mo.
    # Pins the service to ONE instance + disables zero-downtime deploys. See repo-root
    # render.yaml for the full note.
    disk:
      name: noetic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NC_JWT_SECRET
        generateValue: true
      - key: NC_DEFAULT_LLM_PROVIDER
        value: mock
      - key: NC_MOCK_LLM
        value: "true"
      - key: NC_RATE_LIMIT_TIER
        value: enterprise
      - key: NC_RATE_LIMIT_RPM
        value: "120"
      # State-ledger operational enable (step 4 posture). See the repo-root
      # render.yaml for the full durable-posture note. ENABLED=true installs the
      # SqliteStateStore + LedgerMirror; READ_AUTHORITY=true makes the ledger serve
      # public get/list reads. This service now runs on a PAID instance with a
      # persistent disk at /var/data (see the `disk:` block above), so the served
      # ledger state survives restart / redeploy / idle spin-down — single-host
      # durable. Phase 4 (dict deletion) stays held.
      - key: NC_STATE_LEDGER_ENABLED
        value: "true"
      - key: NC_STATE_LEDGER_READ_AUTHORITY
        value: "true"
      - key: NC_STATE_LEDGER_PATH
        value: /var/data/state_ledger.db
      # CRM lead capture durability: append-only JSONL on the durable disk; unset
      # falls back to the in-memory store that forgets every restart. See repo-root
      # render.yaml for the full note.
      - key: NC_CRM_LEAD_STORE_PATH
        value: /var/data/leads.jsonl
      - key: NC_CORS_ORIGINS
        value: https://noeticcompass.com,https://www.noeticcompass.com,http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
      - key: NC_CORS_ORIGIN_REGEX
        value: 'https://(.*\.)?noeticcompass\.com|https://([a-z0-9-]+\.)*vercel\.app|http://localhost(:\d+)?|http://127\.0\.0\.1(:\d+)?'
      # CAS Harness Evidence Packet anchoring. Keep these dashboard-managed:
      # setting mode=s3 without valid AWS credentials makes every new packet
      # report Anchor failed. See docs/DEPLOYMENT.md for the smoke verifier.
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_MODE
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_BUCKET
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_PREFIX
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_REGION
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_OBJECT_LOCK_MODE
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_RETENTION_DAYS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: NC_DATABASE_URL
        sync: false
      - key: NC_OPENAI_API_KEY
        sync: false
      - key: NC_ANTHROPIC_API_KEY
        sync: false
      - key: NC_GOOGLE_API_KEY
        sync: false
      - key: NC_META_API_BASE_URL
        sync: false
      - key: NC_META_API_KEY
        sync: false
      - key: NC_XAI_API_KEY
        sync: false
      - key: NC_DEEPSEEK_API_KEY
        sync: false
      - key: NC_QWEN_API_KEY
        sync: false

  - type: web
    name: noetic-compass-dashboard
    runtime: static
    rootDir: noetic-compass-scaffold/noetic-compass
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd dashboard && npm ci && npm run build
    staticPublishPath: dashboard/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://noetic-compass-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
