[workspace]
members = [".", "crates/casc-cli", "crates/casc-ir", "crates/casc-syntax", "crates/casc-types", "crates/caspm"]
default-members = [".", "crates/casc-cli", "crates/casc-types"]
resolver = "2"

[package]
name = "cas-engine"
version = "0.1.1"
edition = "2021"
description = "CAS Scoring Engine for Noetic Compass"
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }
casc-ir = { path = "crates/casc-ir" }
casc-types = { path = "crates/casc-types" }
casc-syntax = { path = "crates/casc-syntax" }

[dev-dependencies]
quickcheck = "1"
quickcheck_macros = "1"
criterion = "0.5"
proptest = "1"

[features]
default = []
python = ["pyo3"]

[lib]
name = "cas_engine"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
