[package]
name = "casc-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tooling for the CAS compiler"

[dependencies]
cas-engine = { path = "../.." }
casc-syntax = { path = "../casc-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "casc"
path = "src/main.rs"
