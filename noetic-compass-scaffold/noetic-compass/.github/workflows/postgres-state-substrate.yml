name: Postgres State Substrate (live)

# Live verification of the multi-host Postgres StateStore backend
# (api/services/production/state_substrate/postgres_store.py).
#
# The tests in tests/test_state_substrate_postgres.py SKIP unless
# NC_TEST_POSTGRES_URL points at a reachable Postgres. This workflow stands one up
# as a `postgres:16` SERVICE CONTAINER, points the env var at it, and runs the file
# -- turning the "live contract conformance + durability + fence-MINT monotonicity"
# tests from SKIPPED into EXECUTED on every push/PR that touches the substrate.
#
# This is the one-command live path the local Windows dev box could not provide
# (no Docker / no admin there). On 2026-06-02 the same tests were observed to pass
# 10/10 against a local embedded PostgreSQL 16.4 cluster; this job is the portable,
# repeatable re-proof in CI.

on:
  push:
    branches: ['*']
    paths:
      - 'noetic-compass-scaffold/noetic-compass/api/services/production/state_substrate/**'
      - 'noetic-compass-scaffold/noetic-compass/tests/test_state_substrate_postgres.py'
      - 'noetic-compass-scaffold/noetic-compass/.github/workflows/postgres-state-substrate.yml'
  pull_request:
    branches: [master]
    paths:
      - 'noetic-compass-scaffold/noetic-compass/api/services/production/state_substrate/**'
      - 'noetic-compass-scaffold/noetic-compass/tests/test_state_substrate_postgres.py'
      - 'noetic-compass-scaffold/noetic-compass/.github/workflows/postgres-state-substrate.yml'
  workflow_dispatch: {}

jobs:
  postgres-live-tests:
    name: Postgres StateStore live contract + durability + fencing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nc_harness_test
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U postgres -d nc_harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test module reads exactly this variable; when it points at a reachable
      # server the live tests run instead of skipping.
      NC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/nc_harness_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg + pytest
        working-directory: noetic-compass-scaffold/noetic-compass
        # psycopg[binary] is already declared in requirements.txt /
        # requirements-runtime.txt; install it (plus pytest) directly so this job
        # stays fast and does not need the Rust/maturin build the main CI does.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3.1,<4.0" pytest

      - name: Sanity-check the driver and DSN
        working-directory: noetic-compass-scaffold/noetic-compass
        run: |
          python - <<'PY'
          import os, psycopg
          dsn = os.environ["NC_TEST_POSTGRES_URL"]
          with psycopg.connect(dsn) as c:
              v = c.execute("select version()").fetchone()[0]
              print("connected:", v)
          PY

      - name: Run live Postgres StateStore tests
        working-directory: noetic-compass-scaffold/noetic-compass
        # -p no:cacheprovider keeps the runner clean; the file's three test groups
        # (pure fencing logic + live contract/durability + live fence MINT) all run
        # here because NC_TEST_POSTGRES_URL is set.
        run: python -m pytest tests/test_state_substrate_postgres.py -v -p no:cacheprovider
