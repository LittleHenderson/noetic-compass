name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]

jobs:
  rust-tests:
    name: Rust Tests (cas-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noetic-compass-scaffold/noetic-compass/cas-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('noetic-compass-scaffold/noetic-compass/cas-engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        working-directory: noetic-compass-scaffold/noetic-compass/cas-engine
        run: cargo test --all-features

  python-tests:
    name: Python Tests (API + Validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('noetic-compass-scaffold/noetic-compass/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: noetic-compass-scaffold/noetic-compass
        run: |
          pip install -r requirements.txt
          cd cas-engine && maturin develop --features python && cd ..

      - name: Run Python tests
        working-directory: noetic-compass-scaffold/noetic-compass
        run: python -m pytest tests/ validation/ -v

  frontend-tests:
    name: Frontend Tests (Dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: noetic-compass-scaffold/noetic-compass/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npm ci

      - name: TypeScript type check
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npx tsc --noEmit

      - name: Run Vitest
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npx vitest run
