# Render Blueprint - Noetic Compass platform
#
# Render's Blueprint flow looks for this file at the Git repo root by default.
#
# This Blueprint manages ONE service:
#   - noetic-compass-api  (Docker, FastAPI + cas-engine Rust crate)
#     Shared backend for noeticcompass.com AND the Atlas Viewer alpha. The
#     visual_grounding router is registered in api/main.py; Atlas Viewer
#     calls it via /atlas/visual-grounding/{trace_id}.
#
# The atlas-viewer-app static site (https://atlas-viewer-app.onrender.com)
# is dashboard-managed (created 2026-05-22 via Render REST API after the
# Blueprint validator rejected the inline static-site block). It tracks
# the same master branch + auto-deploys on commit. Re-onboarding it into
# this Blueprint is a wave-5+ task; see
# docs/working/atlas_viewer_full_roadmap_2026_05_22.md item 13.

services:
  - type: web
    name: noetic-compass-api
    runtime: docker
    rootDir: noetic-compass-scaffold/noetic-compass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health
    # Persistent disk = durable single-host storage for the state ledger + CRM leads.
    # Render disks attach only to PAID instance types (starter/standard/pro), billed
    # separately at ~$0.25/GB/mo (a 1 GB disk is ~25 cents/month). A disk pins the
    # service to ONE instance and disables zero-downtime deploys (Render stops the old
    # instance to move the disk) — acceptable pre-launch, a reason to move to Postgres
    # before scaling to multiple instances.
    disk:
      name: noetic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NC_JWT_SECRET
        generateValue: true
      # CAS Harness scoped-beta Phase 1 — POST /auth/token mint lock (api/routes/auth.py).
      # In production (debug=False) the mint REQUIRES this shared secret, presented as the
      # X-Auth-Mint-Secret header or `mint_secret` body field, or it returns HTTP 401 —
      # closing the prior anonymous-mint hole (any username, no credential). Operator-set
      # (dashboard-managed); the dashboard / Atlas Viewer client must send it to mint a
      # login token. Left UNSET in production, the mint refuses entirely (production is
      # never an open mint). Local dev (debug=True) keeps the frictionless open mint
      # regardless of this value. Phase 2 replaces this single shared secret with
      # per-account issued API keys.
      - key: NC_AUTH_MINT_SECRET
        sync: false
      - key: NC_DEFAULT_LLM_PROVIDER
        value: mock
      - key: NC_MOCK_LLM
        value: "true"
      - key: NC_RATE_LIMIT_TIER
        value: enterprise
      - key: NC_RATE_LIMIT_RPM
        value: "120"
      # Customer accounts/billing remain dark until the hardened account, UI,
      # Evidence Packet object store, provider reconciliation, and billing branches
      # are merged and hosted multi-replica proof passes. Do not flip only one flag:
      # billing startup requires accounts + quotas together.
      - key: NC_ACCOUNTS_ENABLED
        value: "false"
      - key: NC_QUOTAS_ENABLED
        value: "false"
      - key: NC_BILLING_ENTITLEMENTS_ENABLED
        value: "false"
      - key: NC_BILLING_PROVIDER
        value: "null"
      - key: NC_BILLING_ADMIN_SECRET
        sync: false
      - key: NC_STRIPE_SECRET_KEY
        sync: false
      - key: NC_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NC_STRIPE_PROFESSIONAL_PRICE_ID
        sync: false
      - key: NC_STRIPE_ENTERPRISE_PRICE_ID
        sync: false
      - key: NC_STRIPE_CHECKOUT_SUCCESS_URL
        sync: false
      - key: NC_STRIPE_CHECKOUT_CANCEL_URL
        sync: false
      - key: NC_STRIPE_PORTAL_RETURN_URL
        sync: false
      # State-ledger operational enable (strangler-fig step 4 posture).
      # ENABLED=true installs the SqliteStateStore + LedgerMirror so every
      # mirrored mutation is dual-written; READ_AUTHORITY=true makes the ledger
      # serve public get/list reads. This step is gated by the hosted shadow
      # proof in docs/working/production_readiness/16_hosted_shadow_enable_evidence_2026_06_02.md.
      # Phase 4 (dict deletion) stays HELD.
      #
      # DURABLE POSTURE: this service now runs on a PAID instance with a persistent
      # disk mounted at /var/data (see the `disk:` block above). With READ_AUTHORITY=true
      # the ledger SERVES public reads, so its durability is load-bearing — the disk is
      # what lets that served state survive deploy / restart / idle spin-down instead of
      # resetting to empty on every cold start (the prior /tmp free-tier behaviour, which
      # showed as audit_count=0 after each spin-down). This is single-host durability. It
      # is NOT multi-host durability: that needs the PostgresStateStore (built + verified
      # at commit c32f639, PG 16.4, 10/10) wired into install_state_ledger, which still
      # hard-codes SqliteStateStore. Phase 4 (dict deletion) stays HELD.
      - key: NC_STATE_LEDGER_ENABLED
        value: "true"
      - key: NC_STATE_LEDGER_READ_AUTHORITY
        value: "true"
      - key: NC_STATE_LEDGER_PATH
        value: /var/data/state_ledger.db
      # CRM lead capture durability: persist captured leads to the durable disk as an
      # append-only JSONL file. Unset (the prior hosted state) falls back to the
      # in-memory store that forgets EVERY restart — a captured lead is a revenue record,
      # so production must keep them. JsonlFileLeadStore is single-host durable; a real
      # database is the eventual backend behind the unchanged LeadStore seam.
      - key: NC_CRM_LEAD_STORE_PATH
        value: /var/data/leads.jsonl
      # CAS Harness Evidence Packet store durability: persisted hash logs and static
      # anchor receipts must survive deploy/restart so /evidence/{trace_id}/verify can
      # re-read the receipt after an Object-Lock anchor. Without this env var the store
      # defaults to temp storage, which is not a production verification surface.
      - key: CAS_HARNESS_EVIDENCE_PACKET_STORE_DIR
        value: /var/data/evidence_packets
      # External CRM sync. Default app behavior is capture-only (`NC_CRM_PROVIDER=null`).
      # To actually land leads in Airtable, set these dashboard-managed values together:
      # NC_CRM_PROVIDER=airtable, NC_AIRTABLE_TOKEN, NC_AIRTABLE_BASE_ID, and optionally
      # NC_AIRTABLE_TABLE_NAME (defaults to "Leads"). A half-configured provider fails
      # startup loudly rather than pretending sync works.
      - key: NC_CRM_PROVIDER
        sync: false
      - key: NC_AIRTABLE_TOKEN
        sync: false
      - key: NC_AIRTABLE_BASE_ID
        sync: false
      - key: NC_AIRTABLE_TABLE_NAME
        sync: false
      - key: NC_AIRTABLE_API_BASE_URL
        sync: false
      # Anonymous public lead-capture abuse guard. This is separate from the API-key rate
      # limiter because /api/crm/public is intentionally unauthenticated.
      - key: NC_CRM_PUBLIC_LEAD_RATE_LIMIT_MAX
        value: "5"
      - key: NC_CRM_PUBLIC_LEAD_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      # NC_CORS_ORIGINS — explicit allowlist. The Atlas Viewer alpha entries
      # (atlas-viewer-app.onrender.com + the future atlas.noeticcompass.com
      # custom domain) are listed alongside the original Compass dashboard
      # origins. The NC_CORS_ORIGIN_REGEX below also permits *.noeticcompass.com
      # but explicit > implicit for production CORS.
      - key: NC_CORS_ORIGINS
        value: https://noeticcompass.com,https://www.noeticcompass.com,https://atlas.noeticcompass.com,https://atlas-viewer-app.onrender.com,http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
      - key: NC_CORS_ORIGIN_REGEX
        value: 'https://(.*\.)?noeticcompass\.com|https://([a-z0-9-]+\.)*vercel\.app|http://localhost(:\d+)?|http://127\.0\.0\.1(:\d+)?'
      # CAS Harness hosted worker route. These are intentionally dashboard-managed:
      # an unset URL keeps the live lane dark, while every non-loopback URL is blocked
      # unless the matching service token is also configured. The worker image serves
      # port 8080; never restore the retired 8888/Jupyter endpoint here.
      - key: ATLAS_LIVE_WORKER_URL
        sync: false
      - key: ATLAS_LIVE_WORKER_TOKEN
        sync: false
      # CAS Harness Evidence Packet anchoring. Keep these dashboard-managed:
      # setting mode=s3 without valid AWS credentials makes every new packet
      # report Anchor failed. See docs/DEPLOYMENT.md for the smoke verifier.
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_MODE
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_BUCKET
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_PREFIX
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_REGION
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_OBJECT_LOCK_MODE
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_RETENTION_DAYS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: NC_DATABASE_URL
        sync: false
      - key: NC_OPENAI_API_KEY
        sync: false
      - key: NC_ANTHROPIC_API_KEY
        sync: false
      - key: NC_GOOGLE_API_KEY
        sync: false
      - key: NC_META_API_BASE_URL
        sync: false
      - key: NC_META_API_KEY
        sync: false
      - key: NC_XAI_API_KEY
        sync: false
      - key: NC_DEEPSEEK_API_KEY
        sync: false
      - key: NC_QWEN_API_KEY
        sync: false
