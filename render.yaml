# Render Blueprint - Noetic Compass platform
#
# Render's Blueprint flow looks for this file at the Git repo root by default.
#
# This Blueprint manages ONE service:
#   - noetic-compass-api  (Docker, FastAPI + cas-engine Rust crate)
#     Shared backend for noeticcompass.com AND the Atlas Viewer alpha. The
#     visual_grounding router is registered in api/main.py; Atlas Viewer
#     calls it via /atlas/visual-grounding/{trace_id}.
#
# The atlas-viewer-app static site (https://atlas-viewer-app.onrender.com)
# is dashboard-managed (created 2026-05-22 via Render REST API after the
# Blueprint validator rejected the inline static-site block). It tracks
# the same master branch + auto-deploys on commit. Re-onboarding it into
# this Blueprint is a wave-5+ task; see
# docs/working/atlas_viewer_full_roadmap_2026_05_22.md item 13.

services:
  - type: web
    name: noetic-compass-api
    runtime: docker
    rootDir: noetic-compass-scaffold/noetic-compass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NC_JWT_SECRET
        generateValue: true
      - key: NC_DEFAULT_LLM_PROVIDER
        value: mock
      - key: NC_MOCK_LLM
        value: "true"
      - key: NC_RATE_LIMIT_TIER
        value: enterprise
      - key: NC_RATE_LIMIT_RPM
        value: "120"
      # State-ledger operational enable (strangler-fig steps 1-3 posture).
      # ENABLED=true installs the SqliteStateStore + LedgerMirror so every
      # mirrored read is dual-written and shadow-compared, while the in-RAM
      # dicts STILL serve every read (READ_AUTHORITY=false). This is the safe
      # production posture verified locally under real HTTP traffic in
      # docs/working/production_readiness/14_operational_enable_evidence_2026_06_02.md.
      # Step 4 (flip READ_AUTHORITY=true) and Phase 4 (dict deletion) stay HELD.
      #
      # FREE-TIER HONESTY: this service is plan:free, which has an EPHEMERAL
      # filesystem (no persistent disk). NC_STATE_LEDGER_PATH therefore points at
      # /tmp and is wiped on every deploy / restart / idle spin-down. That is fine
      # for the divergence watch (dict-vs-ledger shadow-compare is live, in-process,
      # within one uptime) but it does NOT prove cross-restart durability. Durability
      # was proven separately on multi-host Postgres (commit c32f639, PG 16.4, 10/10).
      # For real hosted durability, move to a paid instance with a persistent disk at
      # /var/data and set NC_STATE_LEDGER_PATH=/var/data/state_ledger.db.
      - key: NC_STATE_LEDGER_ENABLED
        value: "true"
      - key: NC_STATE_LEDGER_READ_AUTHORITY
        value: "false"
      - key: NC_STATE_LEDGER_PATH
        value: /tmp/state_ledger.db
      # NC_CORS_ORIGINS — explicit allowlist. The Atlas Viewer alpha entries
      # (atlas-viewer-app.onrender.com + the future atlas.noeticcompass.com
      # custom domain) are listed alongside the original Compass dashboard
      # origins. The NC_CORS_ORIGIN_REGEX below also permits *.noeticcompass.com
      # but explicit > implicit for production CORS.
      - key: NC_CORS_ORIGINS
        value: https://noeticcompass.com,https://www.noeticcompass.com,https://atlas.noeticcompass.com,https://atlas-viewer-app.onrender.com,http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
      - key: NC_CORS_ORIGIN_REGEX
        value: 'https://(.*\.)?noeticcompass\.com|https://([a-z0-9-]+\.)*vercel\.app|http://localhost(:\d+)?|http://127\.0\.0\.1(:\d+)?'
      - key: ATLAS_LIVE_WORKER_URL
        value: https://6bmmab3vbf1yij-8888.proxy.runpod.net
      # CAS Harness Evidence Packet anchoring. Keep these dashboard-managed:
      # setting mode=s3 without valid AWS credentials makes every new packet
      # report Anchor failed. See docs/DEPLOYMENT.md for the smoke verifier.
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_MODE
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_BUCKET
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_PREFIX
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_REGION
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_OBJECT_LOCK_MODE
        sync: false
      - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_RETENTION_DAYS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: NC_DATABASE_URL
        sync: false
      - key: NC_OPENAI_API_KEY
        sync: false
      - key: NC_ANTHROPIC_API_KEY
        sync: false
      - key: NC_GOOGLE_API_KEY
        sync: false
      - key: NC_META_API_BASE_URL
        sync: false
      - key: NC_META_API_KEY
        sync: false
      - key: NC_XAI_API_KEY
        sync: false
      - key: NC_DEEPSEEK_API_KEY
        sync: false
      - key: NC_QWEN_API_KEY
        sync: false
