# Render Blueprint - Noetic Compass platform
#
# Render's Blueprint flow looks for this file at the Git repo root by default.
#
# This Blueprint manages ONE service:
#   - noetic-compass-api  (Docker, FastAPI + cas-engine Rust crate)
#     Shared backend for noeticcompass.com AND the Atlas Viewer alpha. The
#     visual_grounding router is registered in api/main.py; Atlas Viewer
#     calls it via /atlas/visual-grounding/{trace_id}.
#
# The atlas-viewer-app static site (https://atlas-viewer-app.onrender.com)
# is dashboard-managed (created 2026-05-22 via Render REST API after the
# Blueprint validator rejected the inline static-site block). It tracks
# the same master branch + auto-deploys on commit. Re-onboarding it into
# this Blueprint is a wave-5+ task; see
# docs/working/atlas_viewer_full_roadmap_2026_05_22.md item 13.

services:
  - type: web
    name: noetic-compass-api
    runtime: docker
    rootDir: noetic-compass-scaffold/noetic-compass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NC_JWT_SECRET
        generateValue: true
      - key: NC_DEFAULT_LLM_PROVIDER
        value: mock
      - key: NC_MOCK_LLM
        value: "true"
      - key: NC_RATE_LIMIT_TIER
        value: enterprise
      - key: NC_RATE_LIMIT_RPM
        value: "120"
      # NC_CORS_ORIGINS — explicit allowlist. The Atlas Viewer alpha entries
      # (atlas-viewer-app.onrender.com + the future atlas.noeticcompass.com
      # custom domain) are listed alongside the original Compass dashboard
      # origins. The NC_CORS_ORIGIN_REGEX below also permits *.noeticcompass.com
      # but explicit > implicit for production CORS.
      - key: NC_CORS_ORIGINS
        value: https://noeticcompass.com,https://www.noeticcompass.com,https://atlas.noeticcompass.com,https://atlas-viewer-app.onrender.com,http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
      - key: NC_CORS_ORIGIN_REGEX
        value: 'https://(.*\.)?noeticcompass\.com|https://([a-z0-9-]+\.)*vercel\.app|http://localhost(:\d+)?|http://127\.0\.0\.1(:\d+)?'
      - key: ATLAS_LIVE_WORKER_URL
        value: https://6bmmab3vbf1yij-8888.proxy.runpod.net
      - key: NC_DATABASE_URL
        sync: false
      - key: NC_OPENAI_API_KEY
        sync: false
      - key: NC_ANTHROPIC_API_KEY
        sync: false
      - key: NC_GOOGLE_API_KEY
        sync: false
      - key: NC_META_API_BASE_URL
        sync: false
      - key: NC_META_API_KEY
        sync: false
      - key: NC_XAI_API_KEY
        sync: false
      - key: NC_DEEPSEEK_API_KEY
        sync: false
      - key: NC_QWEN_API_KEY
        sync: false
