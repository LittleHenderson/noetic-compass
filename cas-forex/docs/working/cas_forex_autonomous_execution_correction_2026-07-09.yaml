explicit_prohibitions_retained:
  - sending broker orders from the MT5 snapshot or account panel route
  - trading when live mode is not armed
  - using stale broker truth for live dispatch
  - bypassing order_dispatch.py or execution_guard.py
  - reusing consumed edge PASS tokens
  - increasing risk after losses unless the configured risk-loosening rule permits it
  - allowing an upstream risk claim to replace a higher server-calculated broker stop risk
  - sending a candidate to the AI Operator after broker-valued evidence proves no compliant minimum lot exists
  - locking every Operator entry to the broker minimum when larger risk-compliant broker-grid sizes exist
  - allowing the model to invent a free-form lot size instead of selecting an exact sizing_ref
  - increasing lot size because the account is behind a daily profit objective
  - scaling into a losing, stale, unprotected, changed, or missing parent position
  - treating positive price P&L as a winning-parent authorization when reported swap, carry, or commission makes net open P&L non-positive
  - reusing a position-management decision after account, position, open-P&L, cost, guidance, control, candidate, or outcome evidence changes
  - dispatching a scale-in after the authorized parent volume, stop loss, or take profit changes
  - requiring per-add human confirmation for an exact in-envelope Operator scale-in
  - describing overall outcome count as per-group learning readiness when no group meets the sample threshold
  - describing movement-stream STATIC_SIMULATION_FALLBACK as an end-to-end MT5 management block when the primary MT5 dispatch lane is active
  - allowing a stale exported verifier to overrule a newer connected MT5 account snapshot
  - presenting or adding a separate simulator balance, equity, P&L, or positions as the active MT5 account
  - presenting price-only floating P&L as net account growth while reported swap, carry, or commission is omitted
  - allowing Operator context compression to remove active-account identity, after-cost open P&L, or simulator-separation truth
  - counting a deposit, withdrawal, credit, or bonus as trading profit or loss
  - using a stale, different-account, or balance-mismatched realized-growth baseline
  - claiming a cashflow-adjusted growth baseline when the full MT5 deal effects do not tie to current balance
  - treating insertion order as broker-close recency when evaluating the latest outcome
  - pooling outcomes across timeframes to satisfy one behavior group's learning threshold
  - ranking a high-win-rate net loser ahead of a lower-win-rate group with positive after-cost expectancy
  - allowing profit from one symbol, timeframe, direction, or profile group to promote another unprofitable group
  - ranking a historically larger-sized group as the better strategy without comparing after-cost P&L per executed lot
  - converting LOW, MEDIUM, or HIGH conviction into a lot choice when APPROVE omits sizing_ref
  - instructing position management not to rank exact behavior by after-cost evidence
  - presenting a close or partial-close action without its estimated immediate after-cost realization and unmodeled future exit-cost boundary
  - dropping entry timeframe before durable order-attempt and closed-outcome learning records are joined
  - trusting a historical stored pre-trade risk field when immutable broker tick-size, tick-value, entry, stop, and lot evidence can recompute it
  - reconstructing missing historical admission risk from an approximate close, non-stop exit, profitable close, simulator outcome, or ambiguous broker record
  - comparing per-one-lot dollar expectancy across different instrument contracts as if it were comparable strategy edge
  - promoting a behavior or presenting historical press-size support when its admission-risk evidence is incomplete
  - promoting a behavior or authorizing PRESS_EDGE or MAX_WITHIN_ENVELOPE when removing the exact group's single best broker outcome makes after-cost growth non-positive
  - allowing prompt concatenation to negate, reverse, or grammatically corrupt the required after-cost growth-ranking instruction
  - treating supported broker aliases as different markets when grouping outcomes, attaching Operator evidence, enforcing per-symbol exposure, promoting behavior, or counting scale-in exposure
  - allowing Operator status or chart refresh to synchronously wait on slow broker, provider, ledger, or readiness work beyond its bounded control-plane response budget
  - rebuilding mobile, APK, Docker, or public-launch diagnostics on every ordinary Assistant trading conversation
  - presenting a model-inferred current trend, range, momentum, volatility, or opportunity as runtime truth when the supplied current-state evidence does not contain it
  - treating Sunday after 22:00 UTC as forex market closed without symbol-specific broker evidence
  - describing an account snapshot as fresh price evidence when its attached market tick is stale or unavailable
  - retrying an interrupted MT5 demo order after one exact broker-history execution match is available
  - forgetting a recovered demo receipt in later clean learning-sync summaries
  - routing an order or compounding question to page navigation merely because it contains the word open
  - allowing PAPER_POLICY_FALLBACK or any AI approval to open or add exposure after the reconciled daily realized-loss boundary is reached
  - blocking protective or exposure-reducing management merely because the daily entry-loss boundary is reached
  - treating a positive daily loss cap as advisory model context instead of an execution-chokepoint invariant
  - reusing a prior UTC day's realized-today value after day rollover
  - treating unchanged account balance as proof that no new broker deals occurred
  - failing an otherwise valid position decision because the model echoed a context-only open position with no action draft
  - allowing a noncanonical close, reduce, modify, trail, scale, or other mutation to execute without one exact supplied immutable action_ref
  - converting HOLD, WAIT, KEEP_OPEN, NO_ACTION, STAND_DOWN, or an actionless SELECT into any broker-authorized mutation
  - trusting a materially future-dated broker server position timestamp over an exact CAS broker-execution receipt when calculating position age or discretionary hysteresis
  - reporting generic watching while every compounding parent has zero broker-valid lot choices without naming the binding caps
  - describing force_paper_mode as a PAPER or DEMO execution block
  - treating historical CAS receipt gaps as current MT5 open positions without matching account and ticket identity
  - persisting a durable Operator lesson whose premise is contradicted by primary execution truth
  - activating an owner risk override in memory before its durable snapshot is atomically stored
  - losing explicit owner risk authority on API restart
  - requiring risk-loosening friction when the proposed owner-layer edit does not loosen effective dispatch latitude
  - creating new external money destinations without owner setup
  - moving funds through unconfigured providers
  - executing trades or transfers while the master kill switch is active
  - hiding losses, fills, rejected orders, transfer failures, or receipts
  - labeling a configured model as the decision maker when another provider or model acted
  - allowing a historical replay template or default midpoint to enter broker-bound scalp collection
  - consuming a one-shot route identity before current quote truth passes
  - terminating candidate-universe exploration on a closed, stale, missing, unusable, future-dated, or already-emitted PASS
  - allowing a combined learning table with a different profile to hide a fuller broker-verified exact behavior group
  - pooling profitable outcomes from different market regimes to authorize PRESS_EDGE, MAX_WITHIN_ENVELOPE, or adaptation promotion
  - treating legacy UNKNOWN-regime outcomes as regime-comparable promotion authority
  - computing edge preview or duplicate identity from a forming candle that final RouteIntent construction later removes
  - closing or reducing a fresh protected position for generic account-risk reduction solely because of initial spread, commission, or a tiny opening loss before the observation or adverse-R threshold
  - labeling a received but contract-rejected model response as a provider outage or model unavailability
  - allowing the ordinary per-symbol entry cap to disable a separately authorized exact scale-in lane, or reserving a compound slot before one-shot scale-in authorization succeeds
  - building Settings or AI Hedge management handoff from a static simulator while the active scheduler has current MT5 broker and account truth
  - reporting a bounded review-interval deferral as an AI Operator stand-down, model rejection, or no-opinion decision
  - requesting or accepting a generic JSON object when the entry or position model contract has an exact decision schema
  - discarding a valid model decision solely because its unique bare broker ticket key can be mapped unambiguously to one supplied canonical ticket key
  - relaxing exact action_ref authority while normalizing a unique bare broker ticket key

required_logs_and_evidence:
