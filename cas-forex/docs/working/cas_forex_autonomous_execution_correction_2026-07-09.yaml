acceptance_tests:
  - name: ai_places_live_trade_autonomously
    expected: >
      Given live mode is armed, broker truth is fresh, edge and risk gates
      pass, and no kill switch is active, the order is dispatched through the
      chokepoint without per-order human confirmation.
  - name: ai_operator_approves_exact_candidate_autonomously
    expected: >
      Given an exact fresh RouteIntent survives deterministic routing and the
      Operator returns APPROVE plus one supplied sizing_ref for its candidate
      ID, the chosen exact broker-grid lot proceeds through the protected
      dispatch path without per-order human confirmation. Any free-form lot or
      non-size geometry rewrite is rejected and audited.
  - name: ai_operator_selects_larger_risk_compliant_lot
    expected: >
      Given 0.01 is the broker minimum but current stop economics, equity,
      margin, exposure, and owner caps permit 0.02 or more, the sizing planner
      exposes multiple exact choices and a high-conviction Operator approval may
      bind the order to a larger supplied lot. The final execution guard repeats
      every risk and broker check before touch.
  - name: operator_approval_requires_explicit_sizing_ref
    expected: >
      Given sizing options are supplied and the model returns APPROVE without an
      exact sizing_ref, conviction is not converted into a lot. The response
      fails the binding contract; LIVE stands down before broker touch and PAPER
      may use only the declared deterministic growth-gated fallback.
  - name: paper_model_failure_cannot_recycle_known_losing_group_or_press_size
    expected: >
      Given the entry Operator model is unavailable or returns an invalid
      contract, a sample-ready exact group with any non-positive after-cost
      growth metric and a sparse exact group with two or more outcomes and zero
      wins both STAND_DOWN before dispatch. One prior loss may receive only one
      PROBE-or-smaller PAPER retest, no-history or incomplete evidence remains
      bounded to PROBE or the smallest broker-valid lot, and only a complete
      positive sample-ready exact group may use STANDARD. PRESS_EDGE and
      MAX_WITHIN_ENVELOPE are never selected by deterministic outage fallback.
      The durable decision and any resulting broker receipt retain every offered
      size, selected size, maximum executable lot, and limiting risk or broker
      source.
  - name: learning_ranking_normalizes_historical_lot_size
    expected: >
      Given one exact group earned more raw dollars only by using larger lots and
      another has stronger after-cost expectancy per executed lot, CAS ranks the
      stronger normalized edge first while retaining raw net dollars as the
      account-growth scoreboard.
  - name: historical_admission_risk_recomputed_from_broker_tick_contract
    expected: >
      Given an older closed trade stores an understated pre-trade risk estimate
      but retains entry, stop, lot, broker tick size, and broker loss tick value,
      learning recomputes admission stop risk from those immutable contract fields,
      preserves the original value, flags the mismatch, and derives realized
      after-cost R from the recomputed risk.
  - name: exact_mt5_stop_fill_repairs_legacy_admission_risk_without_outcome_leakage
    expected: >
      Given a legacy MT5 demo order retains intended entry, stop, and volume but
      predates saved tick-contract fields, and authoritative MT5 history proves a
      negative broker-side stop-loss close at the exact intended stop, learning
      reconstructs admission risk from the absolute broker gross stop-fill loss,
      excludes commission from stop risk, records the broker ticket and exact-stop
      evidence, and derives after-cost R. An approximate close, non-stop exit,
      profitable close, simulator row, missing volume, invalid direction geometry,
      or ambiguous broker record remains risk-incomplete and cannot promote or
      support larger sizing.
  - name: learning_ranking_prefers_after_cost_r_expectancy_across_instruments
    expected: >
      Given one instrument earns more dollars per lot only because its contract
      and planned stop risk are larger while another earns more after-cost P&L per
      planned risk dollar, CAS ranks the stronger after-cost R expectancy first
      and retains per-lot and raw-dollar metrics as secondary evidence.
  - name: incomplete_admission_risk_cannot_promote_or_supply_press_evidence
    expected: >
      Given an exact group is sample-ready and positive in raw or per-lot dollars
      but broker-valued admission stop risk is incomplete, the group cannot be
      promoted and cannot be labeled historical press-size support. A materially
      different bounded PAPER exploration remains possible only under the normal
      owner envelope with an explicit rationale.
  - name: single_best_outcome_dependency_cannot_promote_or_press_size
    expected: >
      Given an exact sample-ready group is positive after costs only because of
      one unusually strong broker outcome, removing that single best outcome
      makes the remaining group's net P&L or after-cost R expectancy non-positive.
      CAS labels the group outlier-dependent, records the removed ticket and
      robustness metrics, and rejects PRESS_EDGE, MAX_WITHIN_ENVELOPE, or
      adaptation promotion. The autonomous Operator may still stand down or use
      minimum, PROBE, or STANDARD sizing for bounded PAPER evidence collection
      inside the owner envelope without per-trade human confirmation.
  - name: entry_projection_uses_historical_r_expectancy_times_current_stop_risk
    expected: >
      Given complete exact-group after-cost R evidence and a current broker-valid
      sizing option with valued stop risk, its historical dollar projection equals
      R expectancy times current stop risk, records that basis, is comparable
      across instruments, and remains explicitly not a forecast.
  - name: operator_growth_ranking_prompt_is_well_formed
    expected: >
      Scheduled entry and position Operator prompts positively and grammatically
      instruct after-cost R ranking before per-lot, raw expectancy, net P&L, and
      supporting win rate. Prompt assembly contains no negation or malformed
      concatenation that obscures this hierarchy.
  - name: broker_aliases_share_learning_promotion_and_exposure_identity
    expected: >
      Given outcomes or open positions use supported broker aliases or suffixes
      for the same instrument, CAS assigns one canonical market identity for
      exact-group learning, promotion matching, Operator growth evidence,
      per-symbol exposure caps, and scale-in exposure. Original broker spellings
      remain visible, while unknown symbols remain isolated.
  - name: operator_observability_remains_responsive_during_slow_evidence_refresh
    expected: >
      Given rich Operator evidence or chart market data is slow, concurrent
      Operator-state, dispatch-status, MT5-account, and chart-window reads return
      bounded warming, stale, or cached packets without holding the scheduler
      lock or blocking chat and execution control. Rich refresh is single-flight,
      cache age and refresh state remain explicit, and dispatch still requires
      fresh broker truth independently of observational caches.
  - name: ai_operator_stand_down_places_no_order
    expected: >
      Given the Operator returns STAND_DOWN for a fresh candidate, no broker
      order is attempted and the rationale is written to the durable Operator
      trade-edge audit.
  - name: ai_operator_entry_decision_receives_realized_feedback
    expected: >
      Given a prior closed paper or MT5 demo outcome exists for the candidate's
      symbol and direction, the immediate Operator prompt contains that unique
      outcome, aggregate wins/losses/net P&L, current account state, and a flag
      requiring differentiation after the latest loss. The durable decision
      report stores the compact context and its hash.
  - name: duplicate_learning_provenance_counts_one_broker_outcome
    expected: >
      Given one MT5 close is visible through both WASTE-cycle and finalized
      order-attempt evidence, candidate statistics count one trade keyed by
      broker_ticket plus decision_ref while preserving both provenance labels.
  - name: combined_and_broker_exact_group_stats_are_merged
    expected: >
      Given combined paper learning contains a row for the same symbol,
      timeframe, and direction under a different profile while broker-verified
      MT5 learning contains the candidate's fuller exact profile, entry context
      merges both source tables. Candidate evidence selects the full exact
      broker group, retains source and merged-count telemetry, and cannot fall
      back to a truncated recent-outcome window that reverses the measured
      after-cost growth classification.
  - name: dispatch_retains_timeframe_for_outcome_learning
    expected: >
      Given a RouteIntent reaches guarded dispatch, its timeframe and strategy
      survive in the durable proposed-intent and order-attempt evidence so later
      position supervision and closed-outcome learning can join the exact M1,
      M5, M15, H1, or other behavior group.
  - name: action_time_stale_quote_blocks_dispatch
    expected: >
      Given a quote becomes stale or is materially future-dated while the AI is
      deliberating, broker-touch dispatch is blocked even if the earlier
      candidate review returned APPROVE.
  - name: ai_takes_profit_autonomously
    expected: >
      Given a live position has reached the configured profit condition, the AI
      may emit a take-profit close, partial-close, or TP-modification action
      through the same broker-bound dispatch path without per-action human
      confirmation.
  - name: ai_operator_selects_exact_position_management_action
    expected: >
      Given one broker position has multiple deterministic, broker-valid
      discretionary drafts, the immediate Operator receives current account,
      position, control, quote, and realized-outcome context and selects at most
      one exact action_ref or STAND_DOWN. Any unknown action_ref, missing
      decision, or attempted geometry rewrite fails the binding contract before
      broker touch.
  - name: position_context_overanswer_cannot_silence_operator_edge
    expected: >
      Given current_positions includes portfolio context without a management
      draft and position_action_candidates contains the only required decision
      key, a model response containing the valid exact decision plus an extra
      context-only STAND_DOWN row retains the valid selection. The extra row has
      no execution authority, every required key remains mandatory exactly once,
      and an unknown action_ref or missing required decision still fails closed.
  - name: position_prompt_preserves_after_cost_ranking_and_origin
    expected: >
      Given an open position originated from an executed CAS order, the immediate
      position Operator receives its recoverable entry strategy, timeframe,
      decision_ref, and order_id. The system prompt positively instructs exact-
      group after-cost ranking and contains no negating instruction.
  - name: management_actions_expose_immediate_growth_effect
    expected: >
      Given full-close, partial-close, reduce, modify, hold, or scale-in drafts,
      each candidate states the estimated amount immediately realized after
      currently reported costs and clearly states that future exit commission,
      slippage, and fill uncertainty are not included.
  - name: scale_in_r_uses_original_entry_stop_after_breakeven
    expected: >
      Given a protected winning parent has moved its current stop to breakeven
      or profit, scale-in readiness still divides favorable movement by the
      immutable original entry-to-stop risk from the executed order receipt.
      A 0.20R move remains 0.20R rather than becoming 1.0R. If original risk
      geometry is unavailable after principal protection, compounding blocks
      instead of inventing an R multiple.
  - name: tiny_winner_realization_close_requires_explicit_growth_case
    expected: >
      Given a healthy net-positive position remains below the supplied scale-in
      horizon and the only close basis is realizing a tiny positive amount with
      no thesis invalidation evidence, SELECT close must bind the exact selected
      intent and explicitly identify thesis invalidation, deteriorating edge,
      execution stress, portfolio pressure, or account-risk reduction. Tiny
      positive P&L alone is not a close thesis.
  - name: fresh_protected_position_initial_spread_cannot_force_discretionary_close
    expected: >
      Given a fresh broker-protected position is inside its timeframe-derived
      observation window, current R is above -0.10R, and no deterministic
      thesis-invalidation evidence is attached, a model selection to close or
      reduce for generic account-risk reduction fails the semantic contract.
      Operator-only fallback is STAND_DOWN, no broker method is called, and the
      durable validation reason states that initial spread or a tiny opening
      loss is not thesis invalidation. Hard protection and deterministic urgent
      exits remain non-vetoable.
  - name: contradictory_select_close_and_hold_language_stands_down
    expected: >
      Given the model binds a close_full action_ref but its selected intent,
      growth case, reason, or summary says HOLD, leave open, or preserve upside,
      the semantic contract fails before broker touch. Operator-only fallback
      remains STAND_DOWN, the position is unchanged, and the rejected decision
      plus validation reason is durably visible.
  - name: autonomous_broker_effect_receipt_binds_actual_operator_identity
    expected: >
      Given an Operator-selected entry or position-management action reaches
      order dispatch, its durable receipt records the actual provider, model,
      backend, prompt version and hashes, decision-context hash, exact candidate,
      sizing, or action reference, rationale, growth case, and Operator event
      hash. A configured primary model may not be substituted when a fallback
      model actually made the decision.
  - name: ai_operator_compounds_protected_winner_autonomously
    expected: >
      Given a fresh protected parent position is net profitable after every
      currently reported swap, carry, and commission amount, has reached the
      configured R threshold, and compound-unit, position-count, exposure,
      margin, and stop-risk caps permit an add, the position Operator may select
      one exact scale_in action_ref and lot size. A short-lived
      account/config/parent/order-bound authorization is consumed once through
      order_dispatch.py and execution_guard.py, the added volume is reconciled,
      and no per-add human confirmation is required.
  - name: scale_in_feasibility_and_blockers_remain_owner_visible
    expected: >
      Given one or more open positions cannot receive a broker-valid add, every
      management report, dispatch status, Operator chat answer, and Operator
      dropdown exposes SCALE_IN_OPTIONS_READY or NO_SCALE_IN_CANDIDATE, exact
      option and parent counts, max compound units, and each binding risk,
      position, per-symbol, exposure, margin, protection, or profit blocker.
  - name: scale_in_requires_net_profit_after_reported_open_costs
    expected: >
      Given a parent has positive price P&L but reported swap, carry, or
      commission makes net open P&L non-positive, no scale-in candidate is
      offered or authorized. Price P&L, each reported cost component, and net
      open P&L remain visible in the decision and rejection evidence.
  - name: position_decision_cache_invalidates_on_account_or_pnl_change
    expected: >
      Given an earlier position decision exists, any change in bound account,
      position, open-P&L, reported cost, candidate, guidance, control, or
      realized-outcome evidence changes the decision-state hash. The earlier
      selection is not reused and the immediate Operator must decide again.
  - name: scale_in_authorization_rechecks_parent_profit_and_geometry
    expected: >
      Given an exact scale-in was authorized, final dispatch re-reads the parent
      from the broker and requires it to remain net winning after reported
      costs with the same ticket, symbol, side, volume, open price, stop loss,
      and take profit. A changed parent or non-winning parent blocks before
      broker touch and leaves the authorization unconsumed.
  - name: hard_position_protection_is_non_vetoable
    expected: >
      Given a position is missing its baseline stop/target or a high-urgency
      invalidation exit is required, the policy action remains selected even
      when the model is unavailable or stands down. It still requires the
      guarded broker path and fresh receipt reconciliation.
  - name: every_fresh_position_receives_operator_discretion_without_fixed_threshold
    expected: >
      Given a fresh manageable broker position is between every deterministic
      R-multiple, take-profit, time-stop, and invalidation threshold, CAS still
      constructs an immutable exact management menu for that position and asks
      the AI Operator to select one action or STAND_DOWN. A model-selected
      action continues through order dispatch, execution guard, broker truth,
      terminal receipt, and reconciliation without per-action human approval.
  - name: same_symbol_positions_receive_ticket_scoped_operator_choices
    expected: >
      Given two or more open positions share the same broker symbol, every
      Operator choice remains bound to its exact broker ticket and position row.
      Candidate matching resolves broker_ticket first, position or row identity
      second, and symbol only as a final legacy fallback, so one ticket cannot
      steal, suppress, or execute another ticket's management action.
  - name: operator_discretion_model_failure_never_auto_closes_position
    expected: >
      Given only Operator-discretion options are available and the provider is
      absent, times out, or returns an invalid contract, no deterministic or
      paper fallback may select full close, partial close, breakeven, or trail.
      CAS records STAND_DOWN, leaves the position unchanged, and keeps the exact
      option, represented-position, blocked-option, and failure-policy truth
      visible in dispatch status, Operator chat, and the Operator dropdown.
  - name: trailing_exit_dials_reach_broker_management_drafts
    expected: >
      Given trailing_stop_enabled is false, no trail_stop management draft is
      generated. Given it is true, the exact owner-fenced
      trailing_lock_fraction determines the drafted stop and is visible in the
      decision parameters.
  - name: historical_trade_block_is_not_an_active_alert_forever
    expected: >
      Given a transient TRADE_BLOCKED warning is older than its display TTL, it
      remains in the critical-notification audit as EXPIRED_HISTORICAL but is
      absent from the active cockpit alert strip.
  - name: ai_initiates_configured_money_movement_autonomously
    expected: >
      Given money movement is armed, the provider rail is healthy, the
      destination is allowlisted, and the amount is within caps, provider
      dispatch occurs and a receipt is stored without per-transfer human
      confirmation.
  - name: snapshot_route_order_send_blocked
    expected: >
      Any snapshot or account route attempt to send a broker order is blocked
      and logged as a bypass attempt.
  - name: stale_broker_truth_blocks_live_dispatch
    expected: >
      When broker truth is stale, live dispatch is blocked until fresh truth is
      obtained.
  - name: broker_tick_value_risk_cap_blocks_understated_index_order
    expected: >
      Given broker tick size/value and current account equity are available, the
      server recalculates stop risk from order geometry, uses the higher of that
      result and any upstream risk claim, and blocks before broker touch when the
      owner-fenced per-trade risk percentage is exceeded.
  - name: broker_minimum_lot_risk_blocks_before_operator
    expected: >
      Given broker tick size/value, current account equity, stop geometry,
      minimum lot, and lot step are available, when the minimum broker lot
      exceeds the owner-fenced per-trade stop-risk cap, the candidate is
      recorded as BLOCKED_AT_BROKER_MIN_LOT before an AI Operator model call,
      the provider call count remains zero, and the final execution guard
      remains authoritative.
  - name: mixed_outcomes_do_not_fake_group_learning_ready
    expected: >
      Given the overall bound-outcome count reaches the configured sample
      threshold but no symbol x direction x profile group reaches that
      threshold, overall_sample_ready is true while group_learning_ready and
      learning_ready remain false. The Operator must treat the evidence as
      sparse per group rather than adaptation-ready.
  - name: primary_mt5_truth_overrides_legacy_simulator_diagnostics
    expected: >
      Given the active dispatch loop is running through MT5 and the connected
      terminal reports current broker positions, while a separate movement-
      stream or simulator-ledger diagnostic reports STATIC_SIMULATION_FALLBACK
      or zero positions, primary_execution_truth identifies MT5 and dispatch_loop
      as authoritative, exposes the contradiction, keeps PAPER or DEMO execution
      active, and prevents the legacy interpretation from becoming a durable
      Operator lesson.
  - name: current_mt5_account_truth_replaces_stale_verifier_across_cockpit
    expected: >
      Given a current connected MT5 account snapshot and an older exported
      verifier with a different position count or timestamp, the active-account
      endpoint, dashboard, live telemetry, Operator briefing, and Operator
      context all use the current MT5 account identity and position count. The
      stale verifier remains historical evidence and cannot overwrite current
      owner insight.
  - name: secondary_simulator_never_masquerades_as_active_mt5_account
    expected: >
      Given the active PAPER lane is MT5 demo while the separate simulator has a
      different balance, P&L, and position count, the cockpit labels MT5 DEMO as
      PRIMARY and the simulator as SECONDARY - NOT ACTIVE ACCOUNT. Values are
      neither merged nor substituted, and every conflict remains inspectable.
  - name: open_pnl_and_growth_measurement_include_reported_carry_costs
    expected: >
      Given MT5 positions report price P&L plus swap or carry, live telemetry,
      active-account truth, and the Operator briefing expose the gross price
      component, carry component, and net open P&L after those reported costs.
      A balance snapshot or pre-swap position sum is never mislabeled realized
      net account growth.
  - name: mt5_cashflow_adjusted_realized_growth_reconciles_to_balance
    expected: >
      Given complete authoritative MT5 deal history for the selected account,
      CAS classifies deposits, withdrawals, credit, and bonuses as external
      capital flow, includes profit, commission, swap, and fee from every deal,
      and reports cashflow-adjusted realized growth only when the ledger plus
      opening capital ties to the current balance and every deal type is
      understood. A stale account, incomplete opening history, unknown deal
      type, balance mismatch, or component residual makes growth unavailable;
      open P&L remains separate and unrealized.
  - name: recent_outcome_logic_uses_chronological_broker_closes
    expected: >
      Given broker outcomes arrive or merge out of order, CAS sorts them by
      normalized broker close time before choosing recent samples or applying
      post-loss differentiation. File insertion order cannot make an older win
      hide a newer loss or make an older loss veto a newer result.
  - name: learning_groups_rank_after_cost_expectancy_before_win_rate
    expected: >
      Given one exact behavior group wins often but loses money after costs and
      another wins less often but has positive after-cost expectancy and net
      P&L, CAS ranks the profitable group first and labels win rate supporting
      evidence only.
  - name: adaptation_promotion_requires_exact_profitable_behavior_group
    expected: >
      Given outcomes span different symbols, timeframes, directions, or
      profiles, CAS does not pool them to satisfy a promotion threshold. The
      exact promoted group must meet its own sample threshold and have positive
      after-cost expectancy and net P&L; profit from another group cannot
      authorize it.
  - name: press_size_and_promotion_require_regime_comparable_outcomes
    expected: >
      Given a pooled symbol, timeframe, direction, and strategy group is
      profitable and sample-ready only because outcomes from trend, range, or
      other regimes were combined, CAS retains the pooled evidence as context
      but rejects PRESS_EDGE, MAX_WITHIN_ENVELOPE, and adaptation promotion.
      One known opening-regime subgroup must independently meet the minimum
      sample, complete broker-valued risk evidence, positive after-cost R and
      cash growth, and leave-one-best-out robustness requirements. UNKNOWN
      regime history cannot supply that authority. Ordinary owner-fenced
      autonomous PAPER exploration remains available at bounded size.
  - name: operator_chat_preserves_north_star_account_truth_under_context_pressure
    expected: >
      Given a full owner-chat context exceeds a section or final packet budget,
      the prompt still begins with ACTIVE_ACCOUNT_NORTH_STAR containing the
      current account identity, balance, equity, position count, price P&L,
      swap or carry, commission, net open P&L, baseline status, and separate
      simulator and replay labels. The declared fast_owner_chat profile reports
      DECISION_GRADE_CONTEXT only when all of its required owner-explanation
      sections are present; it does not claim to replace the full scheduled
      learning and adaptation profile.
  - name: open_position_stop_risk_reaches_operator_and_ui
    expected: >
      Given an open broker position with entry, current quote, protective stop,
      broker tick economics, and current equity, CAS exposes its direction-aware
      entry-to-current-stop risk, remaining-to-stop drawdown, current cap, and
      breach status to the MT5 panel, ordinary Operator chat, and immediate
      position-management context without creating a retroactive forced-close
      action.
  - name: market_closed_positions_report_watching_not_broken
    expected: >
      Given protected open positions and stale terminal ticks during weekend or
      post-Friday-close hours, CAS reports the quote as market closed and the
      management loop as WATCHING_MARKET_CLOSED. It keeps exact block reasons
      visible and sends no new broker-management action until fresh executable
      quote truth returns.
  - name: m1_m5_fresh_micro_scalp_reaches_operator_dispatch
    expected: >
      Given fresh completed M1 or M5 broker candles and a current executable
      quote, CAS derives the current direction and geometry, labels the candidate
      MICRO_SCALP, and submits that exact candidate to the immediate AI Operator
      before the normal guarded dispatch path. No historical replay direction or
      default midpoint enters broker-bound collection.
  - name: timeframe_scans_rotate_without_cross_cache_starvation
    expected: >
      Given M1, M5, M15, and H1 are enabled in the owner-fenced timeframe dial,
      consecutive scheduler cycles rotate those lanes and maintain independent
      scan caches so an H1 scan cannot suppress a fresh M1 or M5 scalp scan.
  - name: cache_throttled_scheduler_call_is_not_a_completed_market_scan
    expected: >
      Given a timeframe/universe scan remains inside its cache TTL, the next
      scheduler call reports SCAN_THROTTLED_CACHE and
      fresh_market_scan_performed=false while retaining the prior full-scan
      evidence. Operator chat and scheduled context do not describe that call as
      a completed market scan or as a new no-opportunity observation.
  - name: pre_operator_candidate_starvation_reaches_operator_context
    expected: >
      Given repeated fresh PAPER or DEMO scans form no candidate because every
      observed directional score is below the configured floor, the Operator's
      mandatory context reports ALL_OBSERVED_LANES_BELOW_DIRECTIONAL_FLOOR,
      attempt counts, active timeframes, the strongest rejected lane, current
      floor, best tokenless shadow-PASS lane, owner bounds, paper-learning state,
      and active dispatch bridge. The Operator then makes an evidence-based
      owner-fenced adjustment or names an explicit STAND_DOWN. No threshold
      bypass, executable PASS claim, order, or money movement occurs merely from
      this visibility packet.
  - name: below_floor_shadow_pass_is_non_authorizing
    expected: >
      Given an observed direction is below the current admission floor, the
      scanner may perform a read-only edge preview at an in-memory floor of zero
      and report PASS statistics. That preview sets unregistered=true,
      authorization_minted=false, and edge_token_present=false; it cannot call
      mint_token, register an authorization, form a RouteIntent, touch a broker,
      send an order, or move money.
  - name: best_shadow_pass_lane_drives_bounded_paper_admission
    expected: >
      Given every observed lane is below the current floor but at least one
      tokenless shadow preview statistically passes, the focused Operator
      contract identifies the best shadow-PASS lane separately from the highest
      directional score and permits at most an owner-fenced PAPER floor change
      to that shadow lane's exact score. The daily target deficit is not a valid
      reason, and the change itself authorizes no order.
  - name: paper_shadow_pass_policy_restores_candidate_flow_after_invalid_model
    expected: >
      Given both focused model responses violate the candidate-starvation
      contract, PAPER learning is active, MT5Bridge is order-send ready, the best
      shadow PASS is unregistered and tokenless, owner bounds permit the exact
      score, and all fail-safe predicates pass, the deterministic continuation
      policy may set only min_directional_confidence to that score. It cannot run
      in LIVE, register an edge, form a route, touch a broker, or send an order.
  - name: restored_candidate_reaches_immediate_operator_and_mt5_demo
    expected: >
      Given the bounded PAPER admission change allows a later fresh candidate to
      form, that candidate must obtain a new ordinary edge PASS and one-shot
      authorization, pass risk feasibility, receive an independent immediate
      Operator decision, and traverse order dispatch and execution guard before
      MT5 demo can accept it. The resulting broker ticket, filled price, SL, TP,
      lot size, risk estimate, model provenance, and demo/live-money distinction
      are durably recorded; the prior shadow preview is never reused.
  - name: closed_quote_cannot_consume_route_identity
    expected: >
      Given a completed-candle setup while the broker quote is closed, missing,
      stale, unusable, or materially future-dated, CAS emits no RouteIntent and
      writes no one-shot route key. The setup may be evaluated afresh after
      executable quote truth returns.
  - name: blocked_pass_cannot_starve_later_actionable_candidate_lanes
    expected: >
      Given an earlier scan lane has a PASS but current quote truth is closed,
      stale, missing, unusable, materially future-dated, or its exact one-shot
      route was already emitted, the scanner records the blocker and continues
      through later owner-allowed lanes. Only an actionable candidate may stop
      the scan or reach RouteIntent formation; if every candidate is blocked,
      runtime reports NO_ACTIONABLE_ROUTE and sends no order.
  - name: completed_candle_transform_precedes_candidate_preview
    expected: >
      Given the newest market bar is still forming, candidate state removes it
      and rebuilds entry pairs, profile, tuning, and CAS features before edge
      preview, current-quote actionability, duplicate checks, and scan ranking.
      Preview and final RouteIntent therefore bind the same completed-candle
      route key; an already-emitted setup cannot appear new merely because the
      preview included a forming bar.
  - name: operator_chat_reports_current_trade_path_before_strategy_commentary
    expected: >
      Given the owner asks why CAS did not scalp or trade, the primary model
      response leads with the current market-open state, selected timeframe
      lane, and immediate route blockers. It clearly separates those facts from
      risk or evidence commentary and does not misstate public-launch readiness
      as a paper/demo execution block.
  - name: slow_chart_refresh_cannot_silence_operator_chat
    expected: >
      Given a chart provider or MT5 candle call that exceeds its refresh window,
      the chart returns stale or timeout telemetry from its isolated one-flight
      worker while health, Operator state, and Operator Ask remain responsive.
  - name: spec_context_status_cannot_starve_behind_deep_cache
    expected: >
      Given a current governing snapshot on disk, the read-only spec status
      endpoint returns the current version and both prompt surfaces even when an
      unrelated deep-cache refresh is slow or stalled.
  - name: operator_percentage_points_are_not_rescaled
    expected: >
      Given a per-trade risk cap of 0.1 percentage points, both ordinary chat and
      scheduled Operator prompts state that 0.1 means 0.1%, expose a 0.1% human-
      readable label, and never describe the cap as 10%.
  - name: explicit_owner_risk_override_survives_api_restart
    expected: >
      Given the owner explicitly sets a numeric or null risk override, CAS
      atomically stores the override snapshot before activating it. After an API
      restart, the same explicit key and value reload, owner_override remains
      the effective source for that dimension, and reset removes the durable
      file so AI-dial then static-config precedence resumes.
  - name: risk_preview_uses_effective_dispatch_posture
    expected: >
      Given an owner-layer value differs from static config but equals the
      already-effective AI dial, preview reports the owner-layer difference and
      effective posture separately. The effective posture is unchanged, so no
      anti-impulse journal, confirmation, or cooldown is invented. A change that
      actually widens broker-facing latitude still receives every required
      friction gate.
  - name: live_pending_keeps_paper_learning_active
    expected: >
      Given LIVE is requested but not yet authorized and paper trading is
      enabled, the autonomous scheduler continues collecting, managing, and
      dispatching through a final paper-only lane without touching a live
      account.
  - name: paper_fallback_uses_execution_capable_bridge
    expected: >
      Given the connected MT5 account is demo but terminal order_send is not
      available, the paper lane uses the durable internal simulator; given an
      execution-ready demo terminal, it may use that demo bridge. A connected
      live terminal is never selected by the fallback lane.
  - name: algo_on_enables_real_mt5_demo_execution_learning
    expected: >
      Given the connected account is positively identified as demo and terminal
      Algo Trading, account trading, and expert trading are ON, CAS may route an
      Operator-approved paper order to MT5 and collect the resulting broker demo
      receipt without human confirmation. With terminal Algo Trading OFF, that
      same lane cannot claim MT5 execution learning.
  - name: broker_server_clock_is_normalized_before_history_join
    expected: >
      Given the broker encodes MT5 epochs in server-local time, CAS detects the
      whole-hour offset from a current terminal tick, shifts the deal-history
      query window, retains raw timestamps, and joins normalized UTC closes
      without waiting for the host clock to catch up.
  - name: operator_order_attempt_binds_to_closed_demo_position
    expected: >
      Given an Operator-approved AI order was executed through MT5 demo and the
      position later closes, the finalized order-attempt decision_ref and exact
      broker position ticket bind that outcome into learning even when no legacy
      WASTE-cycle row exists. A repeated sync produces no duplicate outcome.
  - name: demo_fill_never_claimed_as_live_money
    expected: >
      Given account_mode is DEMO, execution provenance reports PAPER_MT5 and
      MT5_DEMO_BROKER with live_money=false. Any older LIVE_MT5 classification
      receives an immutable correction event rather than a rewritten history row.
  - name: sunday_reopen_and_tick_freshness_are_not_conflated
    expected: >
      Given Sunday reaches 22:00 UTC, the forex weekly schedule permits current
      broker ticks while Friday after 22:00 UTC and Saturday remain closed.
      Account snapshot age and per-symbol market-tick age/status are reported
      separately, so a fresh terminal read containing an old tick cannot be
      displayed or used as current market movement.
  - name: interrupted_demo_order_receipt_recovers_without_retry
    expected: >
      Given one unresolved PAPER or DEMO MT5 attempt and exactly one compatible
      closed-history position, CAS finalizes the original attempt as
      BROKER_EXECUTED_RECOVERED_FROM_DEMO_HISTORY, binds the broker ticket into
      learning, writes cumulative recovery evidence, and sends no new order.
      Repeated sync is idempotent; ambiguous and live attempts do not auto-recover.
  - name: dispatch_status_reports_running_while_rich_diagnostics_refresh
    expected: >
      Given a local dispatch thread is alive while supervisor, Operator, broker,
      or ledger diagnostics are slow, the status endpoint returns a bounded
      FAST_IN_MEMORY_SHELL with truthful running, lane, cycle, management, and
      durable-control fields instead of WARMING or stopped. Rich diagnostics
      continue asynchronously and never replace action-time broker truth.
  - name: assistant_and_operator_answer_compounding_without_timeout_or_navigation_misroute
    expected: >
      Given the owner asks whether the Operator should open or compound winning
      trades, both chat surfaces answer the trading-authority question within
      their response budgets using current dispatch truth. Neither sends the
      owner to the Trade page, waits indefinitely on a local model, claims a
      stopped loop while it is running, nor places an order from chat itself.
      Known outage questions return immediate bounded local truth. With a
      configured and reachable tiered DeepSeek path, free-form Operator and
      Assistant questions return labeled model responses inside their explicit
      budgets; status does not claim reachability merely because a route exists.
      A question such as WHY DONT YOU SCALP TRADE returns immediate
      LOCAL_TRADE_PATH_TRUTH from the cockpit's rich dispatch snapshot plus the
      newest heartbeat; cold-start telemetry is labeled WARMING rather than
      misreported as a completed AI decision.
  - name: deepseek_v4_flash_and_pro_are_capability_probed_and_role_bound
    expected: >
      Given the DeepSeek V4 Ollama Cloud transport is configured, an ordinary
      owner-chat request routes first to deepseek-v4-flash:cloud while a
      compound_scale_in or other configured high-consequence request routes
      first to deepseek-v4-pro:cloud. Both role routes report independent fresh
      generation health and retain actual provider, model, role, and request
      kind. Exhausted Claude allowance does not block either DeepSeek lane, and
      successful DeepSeek calls do not increment Claude spent_tokens. Model
      probes and chats send no broker order, move no money, and change no dial.
  - name: gemma4_31b_cloud_backup_is_capability_probed_and_failover_bound
    expected: >
      Given Gemma 4 backup is enabled, an ordinary request chain is
      deepseek-v4-flash:cloud then gemma4:31b-cloud, and a high-consequence
      request chain is deepseek-v4-pro:cloud, deepseek-v4-flash:cloud, then
      gemma4:31b-cloud before legacy fallbacks. A bounded forced first-rung
      transport failure reaches Gemma through the real ModelProvider path,
      records failover, and returns schema-valid JSON with
      status=CAS_GEMMA4_BACKUP_READY, action=STAND_DOWN, and orders=[]. The
      proof rejects commentary, malformed JSON, or a nonempty order list and
      sends no broker order, moves no money, and changes no dial.
  - name: assistant_context_builders_are_bounded_and_topic_scoped
    expected: >
      Given an ordinary Assistant trading question while mobile, APK, Docker,
      public-launch, or spec diagnostics are slow, the API event-loop heartbeat
      remains responsive and the model request begins after no more than the
      explicit context budget. The prompt receives fast dispatch truth, a compact
      governing-spec digest, and the command catalog. Expensive external-readiness
      evidence is loaded only when the owner asks for that topic, and a timeout
      becomes an honest unavailable marker instead of an unanswered request.
  - name: assistant_local_fallback_cannot_invent_current_regime
    expected: >
      Given the paid Assistant model is unavailable and the installed local
      deepseek-r1 provider is selected, a conceptual free-form question returns
      an ai-local answer inside the bounded local-model window with bounded output.
      Given a question asks which strategy fits the current PAPER or LIVE lane but
      the fast runtime snapshot contains no validated regime classification, the
      Assistant states that limitation and does not invent a trend, range,
      momentum, volatility, or opportunity. Neither answer sends an order.
  - name: exhausted_claude_budget_uses_working_local_operator_model
    expected: >
      Given the finite Claude allowance is exhausted, the Operator selects the
      installed deepseek-r1 local model, disables hidden reasoning output, keeps
      the model warm, and returns a concise English MODEL_PRIMARY reply inside
      the bounded 55-second API / 50-second model window. Ordinary free-form
      questions do not fail merely because Claude is unavailable, and local
      discretionary position review is throttled so it cannot continuously
      starve owner chat. Assistant diagnostics recognize the selected local
      Operator provider as a configured free-form path and do not call it
      unavailable merely because the Claude allowance is exhausted. Positive
      questions such as are you responding return grounded runtime truth
      without model inference or broad all-systems-green claims.
  - name: local_operator_structured_decisions_survive_paid_budget_exhaustion
    expected: >
      With no paid-model allowance remaining, Ollama loads the configured
      16,384-token context and JSON response mode. Immediate entry and position
      prompts retain complete exact-candidate evidence in durable audit, project
      a compact model view that omits only duplicated global group ledgers, and
      return binding-complete structured decisions. Malformed or incomplete
      output fails closed before broker touch.
  - name: daily_realized_loss_cap_blocks_model_and_degraded_fallback_entries
    expected: >
      Given daily_loss_cap_usd is positive and reconciled broker realized P&L
      today is at or below the negative boundary, the immediate Operator stands
      down before calling a model and the final execution chokepoint independently
      rejects every new entry or scale-in with daily_loss_cap_usd in its blocking
      caps and no broker touch. Model approval and PAPER_POLICY_FALLBACK cannot
      bypass the boundary. Existing-position protection, take-profit, partial
      close, and full close remain available. If the cap is active but reconciled
      daily truth is unavailable, new exposure fails closed; zero disables it.
  - name: daily_loss_truth_rolls_on_utc_day_and_detects_same_balance_deals
    expected: >
      Given the stored reconciled growth snapshot belongs to the prior UTC day,
      the scheduler and guard force a current-day refresh before admitting new
      exposure and never carry yesterday's realized-today value forward. Given
      new broker deals occur while an offsetting capital flow leaves balance
      unchanged, a changed latest-deal fingerprint still forces refresh and the
      current UTC day's complete realized result governs entry and scale-in.
  - name: explicit_actionless_select_normalizes_to_stand_down_only
    expected: >
      Given a provider returns SELECT with null action_ref, null intent,
      NOT_APPLICABLE growth case, and explicit HOLD or keep-open rationale, CAS
      records the raw decision and normalization reason, emits canonical
      STAND_DOWN, selects no broker action, and touches no broker. The adapter
      cannot convert that response into executable authority.
  - name: noncanonical_position_hold_is_bounded_and_mutations_fail_closed
    expected: >
      Given a provider returns a noncanonical single-position or global HOLD,
      WAIT, KEEP_OPEN, NO_ACTION, or STAND_DOWN response, CAS may map it only to
      the uniquely identified supplied position or all expected positions as
      audited no-action decisions. An ambiguous position, unknown position, or
      any noncanonical close, reduce, modify, trail, or scale request lacks an
      exact supplied action_ref and fails closed before broker touch.
  - name: omitted_position_decision_becomes_audited_stand_down
    expected: >
      Given a structured position response omits one required position while
      every supplied executable selection is otherwise exact, CAS inserts an
      audited STAND_DOWN for the omitted position. It never guesses an action,
      symbol, direction, ticket, lot, or action_ref for that position.
  - name: execution_receipt_time_overrides_materially_future_broker_position_time
    expected: >
      Given a broker reports an open-position timestamp materially ahead of the
      host UTC clock while CAS retains the exact broker-execution receipt time,
      position age and discretionary hysteresis use the normalized CAS receipt
      timestamp and log the opened_at source. A future broker-server timestamp
      cannot freeze age at zero or indefinitely suppress eligible management.
  - name: natural_operator_management_receipt_binds_decision_execution_and_learning
    expected: >
      Given a natural PAPER or DEMO v14 Operator decision selects exact supplied
      management actions, every broker effect retains the Operator event hash
      and action_ref, passes order_dispatch.py and execution_guard.py, reconciles
      a terminal receipt, and binds the eventual after-cost broker outcome into
      learning. The evidence distinguishes management from a new entry order,
      records no per-action human confirmation, and never implies money movement
      or durable future edge.
  - name: model_response_contract_rejection_is_not_reported_as_provider_outage
    expected: >
      Given the Operator model transport returns a response but JSON parsing or
      semantic validation rejects it, CAS records model_transport_ok=true,
      model_response_rejected=true, and MODEL_RESPONSE_CONTRACT as the failure
      stage. The action stands down or uses only the existing bounded PAPER
      fallback, but the runtime never calls the provider unavailable. A genuine
      timeout or unreachable provider instead records MODEL_PROVIDER and
      model_transport_ok=false.
  - name: late_completed_trading_model_result_is_single_use_and_kind_bound
    expected: >
      Given an entry or position-management model request exceeds its
      wall-clock budget but later completes, the dispatch scheduler, broker
      reconciliation, position protection, and owner chat continue without
      waiting. The completed result may be delivered exactly once to the same
      decision kind with its original request fingerprint. It is never replayed
      to a second cycle, never crosses between entry and position management,
      and cannot affect an account until current action references, broker
      truth, mode, risk, and execution gates are revalidated.
  - name: model_ready_requires_fresh_successful_generation
    expected: >
      Given a provider is selected, installed, or configured but its latest
      real generation failed, timed out, or has become stale, Assistant and
      Operator status report FAILED, STALE, or NOT_PROBED instead of READY and
      retain the exact provider error. An Ollama RAM or VRAM capacity response
      remains visible to the owner. READY appears only after a fresh real
      generation succeeds.
  - name: authorized_compound_slot_extends_only_exact_scale_in_lane
    expected: >
      Given the ordinary per-symbol entry cap is already full and the owner has
      delegated one or more compound units, an ordinary duplicate entry and an
      unverified is_compound_add flag remain blocked at the base cap. Only after
      the exact parent-bound, sizing-bound, short-lived one-shot scale-in
      authorization succeeds may the final risk gate add the configured
      compound-slot allowance. Planning and dispatch expose the same base cap,
      authorized allowance, and effective cap; the ordinary entry cap remains
      unchanged.
  - name: settings_and_management_runtime_share_active_scheduler_broker_truth
    expected: >
      Given the autonomous scheduler is active on an MT5 demo or live lane, the
      Settings handoff, AI Hedge handoff, and manual management-cycle route
      resolve the scheduler's active bridge, account mode, broker positions, and
      current broker truth. They never substitute a static simulator or a
      disconnected default for that active runtime. If no active scheduler
      runtime is available, the handoff is explicitly blocked or warming rather
      than fabricated.
  - name: review_interval_deferral_is_not_operator_stand_down
    expected: >
      Given a recent valid position review has the same material trigger hash
      and the bounded review interval has not elapsed, CAS reports
      AI_OPERATOR_REVIEW_DEFERRED with the current exact broker-valid choices,
      next review time, and no model call or broker action. It does not count the
      deferral as a model stand-down. A material account, protection, profit-band,
      candidate-menu, guidance, control, or outcome change invalidates the
      deferral and wakes a fresh review inside the interval.
  - name: local_entry_and_position_models_receive_exact_json_schema
    expected: >
      Given entry or position discretion uses the local model, the Ollama request
      carries the exact corresponding JSON schema, including required top-level
      fields, decision enums, immutable candidate or position keys, sizing_ref or
      action_ref binding, and bounded additional properties. Generic JSON-object
      mode is insufficient. Output that violates the schema or semantic contract
      is rejected before broker touch and is not mislabeled as provider outage.
  - name: unique_bare_ticket_key_normalizes_without_relaxing_action_authority
    expected: >
      Given the model returns a bare broker ticket key that maps to exactly one
      supplied canonical ticket:<id> position, CAS may normalize only that key
      and retain the mapping in audit. The chosen mutation must still reference
      one exact supplied immutable action_ref. Unknown or ambiguous ticket keys,
      invented actions, and missing action_ref values fail closed before broker
      touch.
  - name: dual_chat_surfaces_disclose_answer_source
    expected: >
      Given either owner chat surface answers from deterministic CAS runtime
      truth, the selected local model, Claude, or an explicit error fallback, the
      rendered reply visibly discloses that source. A local runtime answer is not
      presented as model inference, and a model response is not presented as a
      broker execution receipt.
  - name: natural_local_model_scale_in_executes_and_reconciles
    expected: >
      Given the local Operator selects one exact protected net-winning parent,
      one exact scale_in action_ref, and one broker-grid lot option inside the
      owner envelope, the one-shot authorization passes through order_dispatch.py
      and execution_guard.py, the MT5 demo broker returns a child ticket, parent
      volume reconciliation proves the add, and the immutable receipt records the
      actual local provider and model. No per-action human confirmation is
      required, and the evidence is labeled demo rather than live money.
  - name: repeated_low_exposure_position_cap_starvation_reaches_operator
    expected: >
      Given at least three fresh cross-market candidates across at least two
      symbols are blocked only by a full concurrent-position cap while total lot
      exposure is no more than 25 percent of its separate ceiling, no explicit
      owner cap override exists, and the owner envelope permits one more slot,
      the focused scheduled Operator must either select the exact current-plus-one
      cap or return an evidence-based STAND_DOWN citing the cap, event count,
      exposure utilization, and portfolio or edge reason. A multi-slot jump is
      rejected, the review itself touches no broker, and every later entry still
      requires its own fresh execution gates and immediate Operator decision.
  - name: position_capacity_widening_revalidates_fresh_mt5_state_at_apply_time
    expected: >
      Given a one-slot capacity decision was valid when proposed, CAS refreshes
      the active MT5 account and positions immediately before applying it. If
      the cap is no longer full, exposure exceeds 25 percent, the current cap or
      owner envelope changed, or broker truth is unavailable, CAS skips the dial
      change, records the exact clearing or block reason, and grants no order
      authority. Only unchanged fresh state may apply the exact one-slot update.
  - name: unallowlisted_destination_blocks_money_movement
    expected: >
      A payout or withdrawal to a destination outside the allowlist is blocked
      and escalated for owner setup.
  - name: master_kill_blocks_all_side_effects
    expected: >
      When the master kill switch is active, every trade and money-movement
      action is blocked.

one_line_summary: >
  CAS Forex is an autonomous AI trading and money-movement platform: the AI
  places orders, manages positions, takes profit, and initiates configured
  funds movement through enforced dispatch, risk, broker-truth, provider,
  receipt, and kill-switch gates; humans configure and recover authority, but
  do not approve every in-envelope action.
