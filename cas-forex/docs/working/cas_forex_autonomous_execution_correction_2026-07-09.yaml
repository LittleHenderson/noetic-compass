version: 2026-07-09-AUTONOMOUS-EXECUTION-CORRECTION
last_updated: "2026-07-15"
product: CAS Forex Web/Phone AI Trading Platform
intent: autonomous_ai_execution
status: GOVERNING_REPLACEMENT_LANGUAGE
north_star_objective: >
  Continuously maximize sustainable realized net account growth across paper,
  external broker demo, and live accounts after spread, commission, swap,
  slippage, and realized losses, while remaining inside the owner-delegated
  loss, exposure, margin, liquidity, and kill-switch envelope. Trade count,
  gross profit, win rate, confidence, lot size, and daily targets are supporting
  measurements, never substitute objectives and never authority to chase a
  quota, martingale losses, or hide risk.
purpose: >
  Correct any wording implying the AI cannot or should not trade, place orders,
  take profit, close positions, or initiate configured money movement.
non_negotiable_product_intent: >
  The AI Operator is the trading edge and autonomous execution layer for the
  platform, not a passive signal generator. Once the owner arms the relevant
  live and money controls, the AI may autonomously place broker-bound orders,
  manage positions, take profit, close or adjust exposure, and initiate
  configured money movement without per-action human confirmation when all
  runtime gates pass. Its governing objective is sustainable realized net
  account growth after all trading costs and losses, not maximum trade count or
  indiscriminate exposure.
replacement_autonomy_clause: >
  The AI can and will place orders, manage positions, take profit, enforce stop
  loss, and initiate configured money movement when live or money mode is armed
  and all runtime gates pass. Human approval is required for authority setup,
  out-of-bounds overrides, new external destination onboarding, policy or
  credential changes, and emergency recovery, not for every in-envelope order
  or transfer.

human_in_loop:
  per_order_required: false
  per_take_profit_required: false
  per_configured_money_movement_required: false
  required_for:
    - initial_live_enablement
    - credential_setup_or_change
    - new_external_destination_onboarding
    - cap_or_policy_increase_outside_existing_authority
    - emergency_recovery_after_master_kill

correct_interpretation_of_existing_controls:
  mode_separation: >
    Paper, demo, and live modes must be visually and mechanically distinct.
    Live autonomy is allowed only when live mode is armed.
  paper_learning_continuity: >
    Requesting LIVE must not silence autonomous paper or demo execution while
    live authority is still pending. When paper trading is enabled and the
    live gates do not yet authorize real-money dispatch, the active execution
    lane remains PAPER through a final paper-only runtime configuration. That
    fallback may use an execution-ready demo terminal or the durable internal
    simulator, but it must never submit to a connected live account. A failed
    edge test still produces a genuine no-trade decision; continuity does not
    authorize fabricated or threshold-bypassing trades.
  mt5_account_panel: >
    The MT5 account panel is a read-only cached mirror. That prevents accidental
    order sends from snapshot routes. It does not prohibit AI order execution
    through the order dispatch path.
  mt5_algo_trading_for_demo_learning: >
    Terminal Algo Trading must be ON when CAS is expected to place, modify, or
    close MT5 demo orders and learn from broker acceptance, fills, slippage,
    rejection, stop-loss, and take-profit outcomes. With Algo Trading OFF, CAS
    may still observe real broker quotes and completed candles, but it cannot
    collect genuine MT5 execution outcomes. The app must surface the terminal,
    account, expert-trading, and trade-API permission truth without implying
    that quote observation alone proves execution learning.
  order_dispatch_chokepoint: >
    All broker-bound orders must pass through order_dispatch.py and
    execution_guard.py. This is the only permitted broker-bound order path.
  ai_operator_trading_edge: >
    The AI Operator reviews each exact fresh RouteIntent candidate and decides
    APPROVE or STAND_DOWN and, when approving, controls lot size by selecting
    one exact sizing_ref from broker-valid PROBE, STANDARD, PRESS_EDGE, and
    MAX_WITHIN_ENVELOPE choices. Those choices are calculated from stop risk,
    equity, free margin, margin utilization, portfolio exposure, broker minimum,
    maximum and lot step, and owner caps. Approval is an executable entry
    decision, not an advisory label: the selected exact order continues through
    order_dispatch.py, execution_guard.py, and the selected broker bridge without
    per-order human confirmation. The model cannot invent a free-form volume or
    rewrite symbol, direction, entry, stop-loss, take-profit, strategy, or
    decision identity. A daily profit-target deficit is never sizing authority.
    The Operator cannot resurrect a deterministic rejection or bypass any
    authority, risk, broker-truth, duplicate, recovery, or kill-switch gate.
    A paper-lane model outage may continue only through the deterministic
    growth-gated fallback: a positive sample-ready exact group may use at most
    STANDARD, sparse or unknown evidence may use only PROBE or the smallest
    broker-valid size, one loss may receive only one bounded retest, and a
    sample-ready non-positive or repeated all-loss exact group must STAND_DOWN.
    The fallback cannot invent a materially different regime case. Every
    decision and broker-effect receipt retains the selected lot, every offered
    sizing option, the maximum executable lot, and the binding limiting source,
    so the owner can distinguish model restraint from a hard broker or risk cap.
    A live-lane model or contract failure requires STAND_DOWN.
  ai_operator_realized_outcome_feedback: >
    Every immediate APPROVE or STAND_DOWN prompt must include current account
    balance, equity, margin, open positions, combined paper learning, the
    broker-verified MT5 demo subset, and candidate-specific realized outcomes
    for the same symbol, direction, and strategy. The prompt and durable report
    retain a context hash. One broker close observed through multiple audit
    paths counts once by broker_ticket plus decision_ref; richer metadata is
    merged rather than double-counted. Combined paper and broker-verified MT5
    exact-group tables are merged by symbol, timeframe, direction, and profile,
    then compared within the market regime captured at entry;
    the presence of a differently profiled combined row may never replace or
    hide the fuller broker-verified exact group. Sparse evidence remains
    explicitly sparse. A prior loss requires materially differentiated regime
    or strategy evidence before repeated sampling, but one loss is not a
    permanent veto.
  ai_operator_position_management_edge: >
    Open-position management is not merely a fixed-rule subsystem labeled AI.
    Fresh broker position and quote truth first produce deterministic,
    broker-valid management drafts. In addition, every fresh manageable broker
    position receives an immutable Operator-discretion menu even when no fixed
    take-profit, stop, or R-multiple threshold has fired. That menu may include
    exact full close, broker-valid partial close or exposure reduction, move to
    breakeven, and owner-enabled trailing-stop choices; the exact choices depend
    on current position size, after-cost P&L, protection geometry, broker grid,
    and owner controls. The immediate AI Operator then selects one exact
    discretionary action per broker position or returns STAND_DOWN using
    current account truth, all open positions, owner guidance, owner-fenced
    controls, and realized outcome history. The model cannot rewrite broker
    ticket, symbol, side, volume, stop-loss, take-profit, or action identity.
    Only position_action_candidates require model decisions; all other current
    positions are portfolio context. A harmless extra model row for a
    context-only position has no executable authority and is ignored, while
    every required decision_position_key must still appear exactly once and
    every SELECT must bind one exact supplied action_ref. One context-only row
    may never invalidate an otherwise valid actionable-position decision.
    Operator-discretion options are never selected by deterministic fallback.
    A missing provider, timeout, malformed response, unknown action_ref, or
    incomplete decision requires STAND_DOWN for those options and leaves the
    position unchanged. Hard protective policy actions retain their separate
    non-vetoable behavior. Repeated discretionary review is bounded so ordinary
    tick movement does not spam the model, while new deterministic triggers,
    scale-in choices, or materially changed action menus remain immediately
    reviewable.
    Provider schema drift may be normalized only when it unambiguously requests
    no action: HOLD, WAIT, KEEP_OPEN, NO_ACTION, or STAND_DOWN. An actionless
    SELECT with null action_ref, null intent, and NOT_APPLICABLE growth case is
    an audited STAND_DOWN, never an executable SELECT. A unique human-readable
    position label may identify one supplied position for this no-action-only
    normalization, and an omitted required position becomes an audited
    STAND_DOWN. Any close, reduce, modify, trail, scale, or other mutation still
    requires one exact supplied action_ref and canonical binding fields; no
    normalization may manufacture broker authority.
    A fresh protected position inside the supplied discretionary observation
    window cannot be closed or reduced merely because initial spread,
    commission, or a tiny opening move makes it negative. In the absence of
    deterministic thesis-invalidation evidence, generic account-risk reduction
    requires either current R at or below -0.10R or elapsed observation equal
    to 25% of the position timeframe, bounded to a minimum of 30 seconds and a
    maximum of 900 seconds. This hysteresis applies only to discretionary
    close or reduce choices; it never delays non-vetoable protection, a hard
    risk breach, emergency flattening, or a deterministic invalidation exit.
    Exact scale_in drafts are first-class discretionary actions. They are
    generated only for a fresh, protected parent whose open P&L is net positive
    after every currently reported swap, carry, and commission amount;
    each sizing option is broker-grid valid and carries current stop risk,
    margin, parent ticket, unit index, sizing_ref, and sizing-plan hash. The
    Operator may select one add without per-add human confirmation. Its
    short-lived authorization is account/config/parent/order bound and one-shot.
    A pre-cost winner that is net losing after reported costs, stale parent,
    changed parent volume or protective geometry, reused authorization, cap
    breach, or unrecognized sizing_ref blocks before broker touch. Current
    quote, open-P&L, cost, account, position, candidate, guidance, control, and
    outcome evidence are bound into the decision cache identity. If any bound
    evidence changes, the old model decision is not reused and a fresh
    immediate position decision is required.
    Every management cycle preserves scale-in status, broker-grid option count,
    qualified-parent count, max compound units, minimum profit R, and each
    binding parent/risk/margin/exposure/position-cap blocker through dispatch
    status, Operator chat, and the Operator dropdown. Zero options is reported
    as a no-trade configuration for those exact conditions, not as a permanent
    0.01-lot policy or unexplained prudence.
    Baseline stop/target installation and high-urgency invalidation exits are
    non-vetoable policy actions. Every selected action still passes through
    order_dispatch.py, execution_guard.py, fresh broker truth, terminal
    permissions, duplicate suppression, and receipt reconciliation.
  open_position_stop_risk_insight: >
    Every broker position with a protective stop exposes broker-valued
    entry-to-current-stop risk, remaining current-equity drawdown to the stop,
    the current per-trade cap, and any cap breach to the MT5 UI, ordinary
    Operator chat, and immediate Operator position management. This evidence
    does not itself force-close an already-open trade.
  market_closed_runtime_truth: >
    A nonzero stale MT5 bid or ask must not keep the app labeled MARKET OPEN.
    Weekend, post-Friday-close, disabled-symbol, materially future, and stale
    tick evidence must fail closed. Protected open positions remain visible and
    supervised as WATCHING_MARKET_CLOSED while broker-side stops and targets
    remain in force; no fresh management action may be dispatched until
    executable quote truth returns.
  sunday_reopen_and_tick_freshness_truth: >
    The standard forex week reopens at Sunday 22:00 UTC and remains open until
    Friday 22:00 UTC unless symbol-specific broker truth says otherwise. CAS
    must distinguish account-snapshot observation age from each instrument's
    terminal tick age. A fresh account read never turns a stale or unavailable
    market tick into fresh price evidence, and Sunday reopen may not be forced
    closed by a Monday-through-Friday-only calendar shortcut.
  adaptive_entry_timeframe_authority: >
    The AI Operator owns an owner-fenced entry-timeframe dial. The autonomous
    scheduler rotates the enabled completed-candle lanes rather than silently
    fixing entries to one timeframe: M1 and M5 are the micro-scalp lane, while
    M15 and H1 are the broader intraday lane. Changing the dial changes which
    lanes may form candidates; it never bypasses edge, risk, quote, duplicate,
    recovery, execution-guard, or kill-switch requirements.
  entry_opportunity_visibility_and_operator_duty: >
    Candidate formation is part of the Operator's mandatory decision-grade
    evidence, not an opaque pre-model filter. Every full market scan preserves
    the raw directional score, configured directional floor, margin to that
    floor, candidate-formation status, edge-test status, strongest rejected
    lane, the best statistically passing below-floor lane, and per-timeframe
    attempt counts. A below-floor shadow edge evaluation is read-only: it may
    estimate the same completed-candle candidate at an in-memory admission
    floor of zero, but it must not mint or retain an edge token, register an
    authorization, form a RouteIntent, touch a broker, or send an order. The
    best shadow-PASS lane is tracked separately from the strongest directional
    score because those can be different lanes. A scheduler invocation skipped
    by a live-candle cache must report SCAN_THROTTLED_CACHE with
    fresh_market_scan_performed=false; it may never be labeled or interpreted as
    a completed scan or as proof that the market lacked opportunity. When
    repeated fresh PAPER/DEMO scans show every observed lane below the current
    directional floor, the scheduled AI Operator must inspect the strongest
    rejected score, owner bounds, paper-learning state, and independent outcome
    evidence before choosing one small owner-fenced adjustment or an explicit
    evidence-based STAND_DOWN. A hold response that omits the exact strongest
    score, current floor, and evidence-based stand-down reason is incomplete.
    Candidate starvation uses a focused entry-opportunity model request before
    broad portfolio commentary, followed by one focused repair attempt when
    needed. If both model responses remain contract-invalid, a deterministic
    continuation policy may lower only the PAPER admission floor to the exact
    best shadow-PASS score when paper learning is active, MT5Bridge is
    demonstrably order-send ready, the preview is unregistered and tokenless,
    owner bounds permit the change, and every other stated prerequisite passes.
    That fail-safe cannot run in LIVE, mint an edge authorization, choose an
    order, touch the broker, or bypass any later gate. The daily profit-target
    deficit cannot justify a lower floor. A lower floor admits candidates for
    fresh edge testing and learning; it is not itself proof of edge,
    profitability, or order authority. Every admitted candidate still requires
    a new full edge evaluation, fresh one-shot authorization, risk feasibility,
    immediate Operator approval, quote, duplicate, recovery, execution-guard,
    and kill-switch gates before dispatch.
  position_capacity_starvation_and_operator_duty: >
    Repeated cross-market candidates blocked only because the ordinary
    concurrent-position cap is full must remain durable Operator evidence when
    separate lot-exposure utilization is low. Three or more cap-only events
    across at least two symbols inside the bounded evidence window require one
    focused scheduled Operator decision whenever no explicit owner override
    fixes the cap and the owner envelope permits one additional slot. The
    Operator may either add exactly one concurrent-position slot or return an
    explicit evidence-based STAND_DOWN that cites the current cap, event count,
    exposure utilization, and a portfolio, correlation, outcome, expectancy,
    edge, or risk reason. It may not jump multiple slots, infer order authority
    from spare capacity, or use the daily target deficit as justification. A
    contract-invalid local-model reply may fall back only to the same bounded
    one-slot policy in PAPER or DEMO. Immediately before applying any widening,
    CAS must refresh the active MT5 account and position snapshot and prove the
    cap is still full, exposure remains at or below 25 percent of its separate
    owner-fenced ceiling, and the exact one-slot recommendation is still valid.
    If positions have closed or state changed, the adjustment is skipped and
    pressure is cleared. Every later candidate still requires fresh ordinary
    edge, sizing, risk, quote, duplicate, recovery, execution-guard, and
    kill-switch gates plus immediate entry-Operator approval before broker touch.
  fresh_micro_scalp_execution: >
    Micro-scalp execution must be formed from current completed M1 or M5 broker
    candles, current bid/ask truth, and a direction derived from current market
    state. Historical replay templates, hard-coded LONG or SHORT direction, and
    default midpoint prices are research inputs only and cannot enter the
    broker-bound RouteIntent collector. Every fresh scalp candidate still
    requires immediate AI Operator APPROVE or STAND_DOWN before guarded dispatch.
  pre_emission_quote_truth: >
    Current quote truth is checked before a completed-candle candidate records
    or consumes its one-shot route identity. A missing, closed, unusable, stale,
    or materially future-dated quote produces no executable candidate and no
    emission key, so a weekend scan cannot waste the setup identity that may be
    valid after the market reopens.
  actionable_candidate_scan_selection: >
    Candidate ranking checks current quote actionability and one-shot emission
    state before a PASS may terminate the market-universe scan. A PASS on a
    closed, stale, missing, unusable, materially future-dated, or already-emitted
    route is retained as blocked evidence while scanning continues through later
    owner-allowed lanes. A blocked PASS cannot monopolize a timeframe, hide an
    actionable alternative, or be represented as an executable opportunity.
    Completed-candle normalization runs before edge preview, duplicate checks,
    and actionability ranking. If a forming bar is removed, entry pairs,
    profile, tuning, and CAS features are rebuilt from completed bars so preview
    and final RouteIntent use the same exact route identity.
  operator_chat_trade_path_truth: >
    When the owner asks why CAS did or did not trade, scalp, enter, close, or
    manage a position, the Operator leads with the exact current runtime state,
    selected timeframe lane, and immediate route blockers before broader
    strategy commentary. Public-launch, legal-review, or live-license state does
    not by itself block paper or demo execution and must not be presented as the
    paper/demo blocker unless runtime evidence says that gate actually fired.
  operator_chat_control_plane_isolation: >
    Observation-only chart and MT5 refresh work must not block the API event
    loop or the shared Operator-chat worker pool. Slow chart/provider work runs
    through an isolated bounded one-flight worker and returns stale or timeout
    telemetry without silencing normal Operator Ask traffic.
  bounded_conversational_runtime_truth: >
    The Assistant and Operator must answer known authority, execution-state,
    compounding, and navigation questions from bounded local runtime truth when
    a paid or local language-model path is unavailable or slow. The word open
    in an order or position question must not be misclassified as page
    navigation. A timed-out model cannot leave the owner without a response or
    falsely report a running dispatch thread as stopped. When a paid model key
    and remaining budget are available, free-form Assistant and Operator
    questions must run off the API event loop and return the real model answer
    inside explicit response budgets. Configuration status must distinguish a
    configured key from provider reachability, and a finite budget from an
    exhausted budget. A current trade-inactivity or scalp question must answer
    immediately from the same rich completed-cycle dispatch snapshot shown in
    the cockpit, overlaid with the newest lock-free heartbeat. When no rich
    cycle exists yet after startup, the answer must call that telemetry warm-up
    rather than inventing prudence, a model stand-down, or a market blocker.
    Availability diagnostics treat a selected local Operator model as a
    configured free-form path even when the separate Claude allowance is
    exhausted, but selected, installed, or configured is never a readiness
    claim. READY requires a fresh successful generation request. Positive
    response-status questions return grounded runtime truth and cannot invent
    broad all-systems-green claims. Ordinary Assistant chat
    builds its fast runtime, compact governing-spec digest, and command catalog
    off the API event loop inside explicit context budgets. Mobile, APK, Docker,
    and public-launch diagnostics are loaded only for a matching owner question,
    never rebuilt for every trading conversation. When the paid Assistant path
    is unavailable and the installed local Operator model is selected, the
    Assistant may use that model with a smaller spec digest, bounded output, and
    a separate response ceiling. A current-regime answer may not infer trend,
    range, momentum, volatility, or opportunity when those fields are absent
    from supplied runtime evidence.
  tiered_deepseek_reasoning_roles: >
    DeepSeek V4 Flash is the continuous low-latency reasoning lane for owner
    chat, routine market review, and ordinary Operator decisions. DeepSeek V4
    Pro is the escalation lane for configured high-consequence request kinds,
    including compound scale-in, escalated entry or position management, money
    movement, and emergency recovery. Request kind selects the lane before the
    provider call and is retained with provider, exact model reference, role,
    prompt/context hashes, response, and resulting action evidence. Pro may
    fall back to Flash, then Gemma 4 31B Cloud, configured Claude, or local
    Ollama; Flash may fall back to Gemma 4 31B Cloud, configured Claude, or
    local Ollama. Every role reports capability from its own fresh successful
    generation rather than configuration alone.
    DeepSeek cloud usage is labeled metered/cloud usage, never local/free, and
    DeepSeek calls cannot consume or increment the separate Claude token
    allowance. A model role changes reasoning capacity, never broker geometry,
    owner authority, action references, risk gates, or execution chokepoints.
  gemma4_large_model_backup: >
    Gemma 4 31B Cloud is the independent large-model backup after the
    DeepSeek role routes and before configured Claude or the smaller local
    emergency fallback. Normal request order is DeepSeek V4 Flash, Gemma 4
    31B Cloud, Claude, then local; high-consequence request order is DeepSeek
    V4 Pro, Flash, Gemma 4 31B Cloud, Claude, then local. Gemma is not READY
    merely because its model reference is configured. A current no-side-effect
    application-path probe must force a bounded first-rung failure, record the
    automatic handoff, and require valid schema-constrained JSON from the exact
    gemma4:31b-cloud reference. A single outer Markdown JSON fence may be
    deterministically removed at the shared structured-output boundary;
    commentary, malformed JSON, unsafe action geometry, or a nonempty order
    list remains a capability failure. Gemma Cloud is metered cloud usage and
    shares the Ollama Cloud transport, so it adds model diversity but does not
    prove independent transport availability.
  spec_context_availability: >
    The current governing workbook snapshot must be directly available to the
    Assistant and Operator. Its read-only status endpoint must not remain at
    WARMING because an unrelated dashboard, broker, or cache refresh is slow.
  operator_percentage_truth: >
    Operator context percentage fields are expressed in percentage points, not
    decimal fractions. A value of 0.1 means 0.1%, never 10%. Chat and scheduled
    reasoning must receive this convention plus human-readable risk labels so
    the model cannot silently multiply a risk cap by 100 in owner-facing prose.
  position_management_exit_dials: >
    Autonomous management must consume the actual owner-fenced exit dials at
    action-draft time. trailing_stop_enabled=0 produces no trailing-stop draft.
    When enabled, trailing_lock_fraction determines the exact lock fraction and
    is retained in decision parameters and audit evidence. No hard-coded exit
    constant may silently override the Operator or owner control surface.
  active_alert_freshness: >
    Critical-notification audit rows are immutable history, but transient
    blocked attempts must not appear forever as current active conditions. The
    in-app strip uses explicit display TTL and ACTIVE versus
    EXPIRED_HISTORICAL state. Expiry changes only presentation; it never deletes
    or rewrites the underlying audit event.
  action_time_market_freshness: >
    Quote age is rechecked at broker-touch time after AI deliberation. A stale
    or materially future-dated attached market quote blocks dispatch even when
    the Operator approved the candidate earlier.
  entry_symbol_targeting: >
    New-entry symbol filtering must occur before route ranking. The owner-fenced
    AI symbol dial defines the base universe; an optional scheduler subset may
    narrow it, and per-symbol position caps remove saturated markets from new
    entries only. Existing saturated positions remain under autonomous
    management. Targeting provenance, effective symbols, eligible symbols, and
    saturation reasons must be visible and durably audited.
  demo_execution_classification: >
    An external MT5 terminal is not automatically live money. Every outcome and
    provenance record must distinguish external_broker_terminal from
    account_mode and live_money. A positively identified demo account is
    PAPER_MT5 in the MT5_DEMO_BROKER lane and must not consume live-pilot
    capacity. Historical misclassifications are corrected by immutable appended
    evidence; original records are not rewritten.
  broker_outcome_learning_binding: >
    Every closed CAS MT5 demo position must join the originating AI decision and
    finalized order attempt by exact broker position ticket. The join retains
    decision_ref, order_id, strategy, direction, timeframe, gross profit,
    commission, swap, close reason, and normalized broker timestamps. Repeated
    syncs are idempotent. A history read with zero identity matches must be
    reported as unbound, not as completed learning.
  interrupted_demo_receipt_recovery: >
    If MT5 demo executes and closes an order after CAS writes ATTEMPT_STARTED
    but before CAS finalizes the receipt, later learning sync may finalize the
    attempt only from one unambiguous closed-history match bound by demo mode,
    MT5 bridge, canonical symbol, direction, exact volume, open-time window,
    magic when present, and protective close geometry when applicable. Recovery
    is idempotent, remains visible cumulatively, and never sends or retries an
    order. Ambiguous or live-money attempts remain blocked for explicit recovery.
  edge_pass: >
    A fresh one-shot edge authorization is consumed where configured. If the
    owner disables that requirement for a strategy, risk and broker gates still
    apply.
  risk_gates: >
    Risk caps apply to paper and live. Within armed live mode, the AI may trade
    autonomously up to the owner-configured caps. Owner override wins, then AI
    dial, then config.
  daily_realized_loss_cap_enforcement: >
    A positive daily_loss_cap_usd is a hard new-exposure boundary measured from
    reconciled broker realized P&L for the current UTC day. Once realized P&L is
    at or below the negative cap, every new entry and scale-in is blocked in
    paper, demo, and live operation regardless of model output, provider
    failure, degraded paper fallback, upstream approval, or stale PASS. An
    active cap fails closed when reconciled daily realized truth is unavailable.
    Protective stop/target modification, take-profit, partial close, full close,
    and other proven risk-reducing management remain available. Zero disables
    this cap. The immediate Operator stage checks it before spending a model
    call, and execution_guard.py checks it again immediately before broker touch.
    Cached daily realized truth is valid only when its UTC day equals the current
    UTC day. UTC rollover forces an immediate account-growth refresh and resets
    the day window. Current-history latest-deal fingerprints are compared even
    when the account balance is unchanged, preventing an offsetting deposit or
    other same-balance deal sequence from hiding a new realized loss. A stale
    period blocks new exposure until fresh reconciled truth exists.
  risk_authority_persistence: >
    Only explicit owner risk-control overrides are durable authority. They are
    atomically persisted before becoming active and survive API restarts,
    including an explicit null meaning unlimited. An absent override key leaves
    that dimension under AI-dial then static-config precedence. Owner-editing
    values, persisted override identity, and effective dispatch caps must be
    reported as separate layers. Preview, confirmation, cooldown, and journal
    posture are calculated from the before/after effective dispatch caps, not
    from a static fallback that the Operator dial already supersedes.
  pre_operator_broker_risk_feasibility: >
    Every overseer-approved entry candidate is valued against current broker
    tick economics, account equity, stop geometry, minimum lot, and lot step
    before an AI Operator model call. A candidate that exceeds the per-trade
    cap even at the broker minimum lot is blocked as
    BLOCKED_AT_BROKER_MIN_LOT and consumes no Operator decision. A candidate
    that can comply at one or more broker-grid sizes receives an exact sizing
    plan containing only currently supportable choices. The AI Operator, not a
    fixed 0.01-lot constant, selects one supplied sizing_ref when it approves
    the entry. The model cannot invent volume and the preflight cannot approve
    or dispatch an order. Unknown estimates remain explicitly unknown and may
    expose only the conservative seed/floor until the authoritative final
    execution guard recalculates the selected size at broker touch.
    If all fresh candidates or qualified scale-in parents have zero broker-grid
    options, runtime and chat must name every binding cap. The Operator may make
    a small owner-fenced dial adjustment only when after-cost evidence supports
    sustainable growth; otherwise it rotates to viable conditions or stands
    down rather than forcing activity.
  group_learning_readiness_truth: >
    Learning readiness is evaluated per symbol x direction x profile group.
    An overall count that reaches the sample threshold does not make grouped
    adaptation ready when those outcomes are scattered across unrelated groups.
    Runtime evidence exposes overall_sample_ready, group_learning_ready, and
    learning_ready_group_count separately.
  execution_truth_precedence: >
    The connected broker account and open positions are authoritative from the
    current MT5 terminal snapshot. Current entry and position-management
    execution state is authoritative from the active dispatch loop. Separate
    movement-stream supervision, simulator-ledger account health, live-readiness
    monitoring, and durable auto-halt evidence retain their own scopes but may
    not override the active primary MT5 PAPER or LIVE lane. force_paper_mode
    blocks live escalation rather than PAPER or DEMO execution. Contradictory
    source states must be exposed as conflicts and may not become durable
    Operator lessons.
  live_enablement: >
    Owner arming of live and money switches grants standing authority. Arming
    does not itself place a trade, but once armed the AI may place trades
    without per-trade confirmation when gates pass.
  broker_truth: >
    Fresh broker account, balance, equity, margin, position, and open-order
    truth is required before live dispatch. Stale truth blocks dispatch.
  active_account_source_precedence: >
    The account governed by the active execution lane is the owner and Operator
    source of truth. When PAPER dispatch is running through a connected MT5 demo
    bridge, the current MT5 account snapshot, balance, equity, open positions,
    protection, and risk outrank an exported verifier, movement stream, or
    separate simulator ledger. Secondary ledgers remain visible only under an
    explicit non-authoritative label and are never added to MT5 money or P&L.
  after_cost_growth_measurement: >
    Account growth and open P&L are measured after reported trading costs. The
    cockpit separately exposes price P&L, swap or carry, commission when known,
    and net open P&L. The same active-account decomposition is mandatory in
    immediate entry, position-management, scale-in, and time-stop reasoning; a
    positive price subtotal cannot authorize compounding while reported costs
    make the position net negative. A current balance is not called profit
    without a reconciled deposit, withdrawal, transfer, fee, and
    realized-outcome baseline.
  reconciled_cashflow_adjusted_realized_growth: >
    The north-star realized-growth baseline comes from the authoritative full
    MT5 deal ledger queried from before the first effective account event through
    the current broker snapshot. Every deal contributes profit, commission,
    swap, and fee to the ledger. Balance deposits, withdrawals, credit, and
    bonuses are classified as capital flow rather than trading profit. CAS may
    report cashflow-adjusted realized growth only when the history belongs to
    the selected account, the first effective event establishes opening
    capital, every deal type is understood, the ledger ties to current balance
    within account-currency rounding, and the growth components tie. Unknown
    deal types, incomplete opening history, a stale or different account, or
    any unexplained residual makes realized growth unavailable. Open P&L stays
    separate and unrealized.
  exact_group_after_cost_learning: >
    Realized learning evidence is ordered by authoritative broker close time and
    grouped by exact symbol, timeframe, direction, and profile or strategy.
    Every autonomous execution receipt and opening memory row preserves the
    candidate's opening market regime, and each exact behavior group is then
    split into regime-comparable outcome groups. Pooled all-regime evidence
    remains visible as context, but it cannot authorize PRESS_EDGE,
    MAX_WITHIN_ENVELOPE, or adaptation promotion. At least one known-regime
    subgroup must independently meet the sample, after-cost, risk-normalization,
    and single-best-outcome robustness requirements. Legacy or unattributed
    UNKNOWN-regime outcomes remain learning context and cannot by themselves
    justify larger sizing or promotion.
    Groups rank first by after-cost R expectancy using broker-valued admission
    stop risk, then by lot-normalized after-cost expectancy, raw after-cost
    expectancy, and actual net P&L. Actual net dollars remain the account
    scoreboard; R removes cross-instrument contract and stop-distance distortion,
    while per-lot normalization removes historical volume distortion inside a
    comparable instrument. Win rate is supporting evidence only. Profit from
    another group cannot subsidize or promote an unprofitable group. Adaptation
    promotion requires complete risk-normalized evidence and the exact promoted
    group to meet its own sample threshold and remain positive after commission,
    swap, fees, and realized losses in R, raw dollars, and per lot when available.
    A positive exact group is not robust press-size or promotion evidence when
    removing its single best realized outcome makes the remaining group
    non-positive. CAS records the removed ticket, leave-one-best-out net P&L and
    after-cost R expectancy, largest-win concentration, recent-window growth,
    and consecutive-loss count. An outlier-dependent group remains available to
    autonomous PAPER minimum, PROBE, or STANDARD learning judgment, but it cannot
    authorize PRESS_EDGE, MAX_WITHIN_ENVELOPE, or adaptation promotion until the
    exact group's after-cost growth survives the single-best-outcome test.
  canonical_broker_alias_market_identity: >
    Learning, promotion, Operator candidate evidence, per-symbol exposure caps,
    and scale-in exposure must compare every supported broker alias through the
    canonical CAS instrument map. NAS100, USTEC, US100, and supported suffix
    variants are one market identity; the same rule applies to every configured
    alias family. Observed broker spellings remain visible for provenance.
    Unknown symbols retain an isolated normalized identity and are never silently
    merged into a supported instrument.
  non_blocking_operator_observability: >
    Operator status, dashboard polling, and chart-window reads are observational
    control-plane surfaces. Slow broker IPC, provider data, account ledgers, or
    readiness reports must refresh through bounded single-flight cache lanes and
    must not hold the Operator scheduler lock, monopolize the shared dashboard
    refresh queue, or make chat and execution status unreachable. Every cached or
    warming packet exposes age, freshness, and refresh state; stale evidence is
    never silently represented as fresh broker truth for dispatch.
  non_blocking_trading_model_decisions: >
    Entry and position-management inference must run through bounded
    single-flight decision lanes so a slow or abandoned model request cannot
    block broker reconciliation, position protection, the dispatch scheduler,
    or owner chat. A lane permits at most one unfinished request. A result that
    completes after its wall-clock deadline may be delivered exactly once to
    the same decision kind, with its original request fingerprint retained;
    entry output cannot be delivered as position-management output or vice
    versa. Before any late result can affect an account, current action
    references, broker truth, mode, and every risk and execution gate must be
    revalidated. Selected, installed, or configured model state is not READY
    until a fresh real generation succeeds. Exact provider failures, including
    RAM or VRAM capacity errors, remain visible and auditable. Compact prompt
    transport may reduce model context, but it never replaces the full
    hash-bound decision evidence.
  historical_admission_risk_reconstruction: >
    Closed-outcome learning recomputes planned stop risk from the immutable entry,
    stop, executed lot, broker tick size, and broker loss tick value before using
    a stored pre-trade risk field. The original stored value remains visible. Any
    material residual or ratio mismatch is counted and audited; stale estimates
    produced by older tick-conversion code cannot become learning or promotion
    authority. A legacy MT5 demo row that predates saved tick-contract fields may
    recover admission risk only when MT5 history proves an exact broker-side stop
    loss: the close reason identifies stop loss, close price equals the intended
    stop, entry/stop direction geometry is valid, volume is known, and broker gross
    P&L is negative. CAS uses the absolute broker gross stop-fill loss, excludes
    commission from the reconstructed stop risk, records the ticket and evidence,
    and leaves approximate, non-stop, profitable, simulator, or ambiguous closes
    incomplete.
  explicit_operator_sizing_choice: >
    An Operator APPROVE with broker-valid sizing options must identify one exact
    supplied sizing_ref. LOW, MEDIUM, or HIGH conviction is explanatory context,
    not a substitute lot-size instruction and cannot be silently mapped to PROBE,
    STANDARD, PRESS_EDGE, or MAX_WITHIN_ENVELOPE. Each option carries exact-group
    sample state and a historical after-cost projection. When risk evidence is
    complete, projection equals exact-group after-cost R expectancy times the
    option's current broker-valued stop risk. Per-lot projection is an explicitly
    non-comparable fallback only. Every projection is evidence, never a promised
    forward profit.
  position_growth_utility_evidence: >
    Position-management prompts recover the originating strategy and timeframe
    from the durable executed-order ledger when available. Every close, partial,
    reduce, modify, hold, or scale-in draft states its immediate realization effect
    using net open P&L after currently reported carry and commission. Future exit
    commission, slippage, and fill uncertainty remain explicitly unmodeled. The
    prompt positively instructs after-cost ranking and may not negate that rule.
    Current R and every scale-in threshold comparison use immutable original
    entry-to-stop risk recovered from the executed order receipt; moving the
    current stop to breakeven or profit does not manufacture 1.0R. A
    realization-only close below the scale-in horizon requires an explicit
    machine-checkable growth case. SELECT-close paired with HOLD rationale or
    summary is a binding-contract failure and leaves the position unchanged.
  autonomous_broker_effect_provenance: >
    Every Operator-selected entry, close, partial close, stop change, target
    change, trail, or scale-in carries the actual decision provider, model,
    backend, prompt version and hashes, decision-context hash, exact candidate,
    sizing, or action reference, rationale, growth case, and Operator event hash
    into order dispatch and the durable broker-effect receipt. Static configured
    model names may remain visible as configuration but may not replace or be
    reported as the model that actually made the decision.
  operator_north_star_context_precedence: >
    Every ordinary Operator conversation receives a non-optional priority
    account block before compressible supporting context. It identifies the
    account governed by the active execution lane, current balance, equity,
    positions, price P&L, swap or carry, commission, net open P&L after reported
    costs, baseline availability, and the separate status of simulator and
    replay evidence. Context compaction may summarize other evidence but may not
    remove or contradict this block. Fast owner chat declares its narrower
    explanation-only required-section profile; scheduled autonomous reasoning
    retains the full learning and adaptation profile.
  take_profit: >
    The AI may create, modify, trail, and execute take-profit logic as a
    first-class trading action. Take-profit is part of autonomous position
    management, not a human-only step.
  money_movement: >
    The AI may initiate deposits, withdrawals, payouts, and internal transfers
    through configured provider rails, owner-enabled capabilities, destination
    allowlists, transfer caps, and receipt logging. Sandbox and live provider
    environments must be explicit; sandbox proof cannot authorize or claim
    external money movement.
  psychological_safeguards: >
    FOMO, revenge, martingale or gambler loops, and post-loss risk loosening
    become explicit dials, caps, cooldowns, and telemetry warnings. They do not
    convert the product into advisory-only mode.
  balance_growth: >
    Sustainable realized net account growth after spread, commission, swap,
    slippage, and losses is the north-star objective. Equity, drawdown, open
    risk, and margin are leading constraints on whether that growth can
    continue. Evidence quality must distinguish real signal from duplicated or
    correlated trades, luck clustering, and overfit strategy behavior. A daily
    target deficit, recent loss, winning streak, or desire for activity cannot
    by itself increase size or force a trade; those behaviors undermine the
    long-run growth objective.

autonomous_trading_authority:
  enabled_when:
    - mode == LIVE
    - live_trading_enabled == true
    - broker_truth_fresh == true
    - instrument_allowlisted == true
    - risk_gates_pass == true
    - cooldown_or_recovery_allows == true
    - master_kill_active == false
  allowed_actions:
    - market_order
    - limit_order
    - stop_order
    - stop_limit_order
    - cancel_pending_order
    - modify_pending_order
    - set_stop_loss
    - modify_stop_loss
    - trail_stop_loss
    - set_take_profit
    - modify_take_profit
    - partial_close
    - full_close
    - scale_in
    - scale_out
    - flatten_exposure
  mandatory_path:
    - order_dispatch.py
    - execution_guard.py
    - broker_bridge

autonomous_money_movement_authority:
  enabled_when:
    - money_movement_enabled == true
    - provider_configured == true
    - provider_environment == LIVE
    - provider_healthy == true
    - origin_account_approved == true
    - destination_allowlisted == true
    - amount_within_caps == true
    - anomaly_checks_pass == true
    - master_kill_active == false
  allowed_actions:
    - deposit
    - withdrawal
    - payout
    - internal_transfer
    - owner_owned_account_transfer
  required_evidence:
    - provider_receipt
    - ledger_entry
    - event_hash
    - before_after_balance_snapshot
    - idempotency_key

authority_model:
  owner_delegated_authority_envelope:
    - broker accounts and API credentials
    - "mode: paper, demo, live"
    - symbol_or_instrument_allowlist
    - max_lot_size_or_notional_per_order
    - max_open_positions
    - max_leverage_and_margin_utilization
    - max_daily_loss
    - max_trailing_drawdown
    - max_transfer_amount_per_event_and_per_day
    - approved_money_movement_provider_rails
    - approved_destination_allowlist
    - emergency_stop_behavior
  human_involvement_levels:
    - level: setup
      human_role: Owner configures credentials, brokers, destinations, caps, and strategy permissions.
      ai_authority: No live trading until armed.
    - level: normal_live_operation
      human_role: Human is not required per order.
      ai_authority: AI places orders, manages positions, and takes profit autonomously.
    - level: normal_money_operation
      human_role: Human is not required per transfer inside configured caps and allowlisted destinations.
      ai_authority: AI initiates configured transfers and stores receipts.
    - level: out_of_bounds_request
      human_role: Human or owner authorization required.
      ai_authority: AI cannot exceed the delegated authority envelope.
    - level: emergency
      human_role: Human may recover, service, or reset after the kill switch.
      ai_authority: AI stops trading and money movement.

execution_policy:
  autonomous_order_lifecycle_requires:
    - mode == LIVE
    - live_trading_enabled == true
    - account_connected_and_broker_truth_fresh == true
    - instrument_allowlisted == true
    - strategy_emits_actionable_signal == true
    - edge_pass_fresh_when_configured == true
    - risk_caps_pass == true
    - recovery_or_cooldown_clear == true
    - master_kill_active == false
    - dispatch_path == order_dispatch.py -> execution_guard.py -> broker_bridge
  position_management_actions:
    - set_initial_stop_loss_and_take_profit
    - move_stop_loss_to_breakeven
    - trail_stop_loss
    - move_or_ladder_take_profit_levels
    - partial_close_at_configured_milestones
    - scale_into_protected_net_winner_after_reported_costs_with_operator_selected_exact_lot
    - full_close_on_invalidation_or_risk_breach
    - flatten_all_exposure_on_emergency_or_policy_condition
  money_movement_lifecycle_requires:
    - money_movement_enabled == true
    - provider_rail_configured_and_healthy == true
    - provider_environment_is_live == true
    - origin_account_approved == true
    - destination_allowlisted == true
    - amount_within_per_event_and_daily_limits == true
    - transfer_purpose_allowed_by_policy == true
    - fraud_or_anomaly_checks_pass == true
    - master_kill_active == false
    - receipt_provider_response_and_ledger_entry_stored == true
    - lost_provider_reference_recoverable_by_idempotency_key == true

