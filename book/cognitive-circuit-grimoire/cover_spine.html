<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 200px; height: 2850px;
  font-family: Georgia, 'Times New Roman', serif;
  background: #1A1A2E; color: #C9A84C;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.title { font-size: 24px; letter-spacing: 6px; writing-mode: vertical-rl;
         text-orientation: mixed; margin-bottom: 40px; }
.author { font-size: 16px; letter-spacing: 3px; writing-mode: vertical-rl;
          text-orientation: mixed; color: #8A7A60; }
.emblem { font-size: 40px; margin: 30px 0; }
.publisher { font-size: 12px; letter-spacing: 2px; writing-mode: vertical-rl;
             text-orientation: mixed; color: #6A5A40; margin-top: 40px; }
</style>
</head>
<body>
<div class="title">THE COGNITIVE CIRCUIT GRIMOIRE</div>
<div class="emblem">&#9883;</div>
<div class="author">HENDERSON</div>
<div class="publisher">NOETIC COMPASS PRESS</div>
</body>
</html>
