# Render Blueprint - CAS Harness account-mode canary
#
# DEPLOYMENT SAFETY: Blueprint Auto Sync MUST stay disabled in Render.
# Manually sync only after `cas-ci-gate` and `cas-postgres-live-gate` pass
# for the exact Blueprint source SHA and the exact canary service source SHA.
# Record those two SHAs separately; a successful sync is not an `ACCEPT` claim.
#
# This is intentionally separate from the production `render.yaml`. Register it
# as a separate Blueprint with this exact file path. It creates only an isolated
# private API and a private managed Postgres database; it cannot receive public
# internet traffic and it does not modify `noetic-compass-api`.
#
# First-deploy operator requirements:
#   1. Set every `sync: false` value during Blueprint creation.
#   2. Generate NC_ACCOUNT_BOOTSTRAP_SECRET with at least 32 random bytes.
#   3. Use least-privilege AWS credentials for the canary S3 prefix.
#   4. After bootstrapping and verifying the first owner, delete
#      NC_ACCOUNT_BOOTSTRAP_SECRET and redeploy. Because it is `sync: false`,
#      later Blueprint syncs do not recreate it.
#
# Account readiness remains OPEN until restart, two-replica, tenant-isolation,
# session-revocation, packet reread, and Object-Lock verification all pass.

projects:
  - name: cas-harness
    environments:
      - name: accounts-canary
        networking:
          isolation: enabled
        permissions:
          protection: enabled

        databases:
          - name: cas-harness-postgres-accounts-canary
            plan: basic-1gb
            region: oregon
            postgresMajorVersion: "16"
            databaseName: cas_harness_accounts_canary
            user: cas_harness_canary
            diskSizeGB: 5
            storageAutoscalingEnabled: false
            # Internal Render networking only. Valid database credentials are
            # still required, but there is no public database ingress.
            ipAllowList: []

        services:
          - type: pserv
            name: cas-harness-api-accounts-canary
            runtime: docker
            repo: https://github.com/LittleHenderson/noetic-compass
            # Repository workflows run automatically for PRs targeting master
            # (and pushes to master). Keep this branch in such a PR, or dispatch
            # CAS CI and CAS Postgres State Substrate manually, so checksPass
            # has a successful check suite to observe.
            branch: release/accounts-canary-20260713
            rootDir: noetic-compass-scaffold/noetic-compass
            dockerfilePath: ./Dockerfile.api
            dockerContext: .
            plan: starter
            region: oregon
            numInstances: 1
            autoDeployTrigger: checksPass
            # Private services have no public onrender.com URL. Do not change
            # this to `web` for convenience; use Render Shell/SSH for smoke.
            envVars:
              - key: NC_DEBUG
                value: "false"
              - key: NC_JWT_ALGORITHM
                value: HS256
              - key: NC_JWT_SECRET
                generateValue: true
              - key: NC_JWT_EXPIRY_MINUTES
                value: "60"

              # One shared Postgres record of truth for accounts, sessions,
              # tenant state, quotas, billing records, and the state ledger.
              - key: NC_DATABASE_URL
                fromDatabase:
                  name: cas-harness-postgres-accounts-canary
                  property: connectionString
              - key: NC_STATE_LEDGER_ENABLED
                value: "true"
              - key: NC_STATE_LEDGER_READ_AUTHORITY
                value: "true"

              # Account mode and remote immutable packet bytes must turn on
              # together in hosted non-debug mode. The bootstrap secret is
              # deliberately operator-set and one-time, not generated by IaC.
              - key: NC_ACCOUNTS_ENABLED
                value: "true"
              - key: NC_ACCOUNT_CREDENTIAL_PEPPER
                generateValue: true
              - key: NC_HUMAN_ATTESTATION_PSEUDONYM_ACTIVE_KEY_ID
                sync: false
              - key: NC_HUMAN_ATTESTATION_PSEUDONYM_KEYRING_JSON
                sync: false
              - key: NC_ACCOUNT_BOOTSTRAP_SECRET
                sync: false
              - key: NC_PLATFORM_TENANT_PROVISIONING_SECRET
                sync: false
              - key: NC_ACCOUNTS_BOOTSTRAP_TENANT_ID
                value: primary
              - key: NC_ACCOUNTS_ALLOW_SINGLE_HOST_SQLITE
                value: "false"
              - key: NC_EVIDENCE_PACKET_OBJECT_STORE_ENABLED
                value: "true"
              # Sharing is earned separately from account/object-store proof;
              # pre-provision its stable key but keep the anonymous surface dark.
              - key: NC_EVIDENCE_SHARES_ENABLED
                value: "false"
              - key: NC_EVIDENCE_SHARE_TOKEN_PEPPER
                generateValue: true

              # Deliberate phased rollout: earn account/session/tenant/storage
              # evidence first. Enable each later gate in a separate deploy.
              - key: NC_DEPLOYMENT_PROFILE
                value: accounts-canary
              - key: NC_QUOTAS_ENABLED
                value: "true"
              # Keep the private proof bounded: two local/no-provider audit
              # runs per tenant are enough to prove success, idempotent retry,
              # isolation, and the exact third-run 429 without paid compute.
              # Public production remains on its separate Blueprint with
              # accounts/quotas dark.
              - key: NC_QUOTA_MONTHLY_AUDIT_LIMIT
                value: "2"
              - key: NC_BILLING_ENTITLEMENTS_ENABLED
                value: "false"
              - key: NC_BILLING_RECONCILIATION_ENABLED
                value: "false"
              - key: NC_BILLING_PROVIDER
                value: "null"
              - key: NC_FLEET_SERVICE_AUTH_ENABLED
                value: "false"

              # The canary writes to a dedicated prefix in the existing
              # Object-Lock bucket. Bucket and credentials are operator-set;
              # no account or cloud credential is stored in this file.
              # Tenant packet bytes below are already Object-Locked. Keep the
              # older global anchor writer dark in this account-isolation
              # canary so the new credential needs access only to this
              # tenant-aware packet prefix and cannot double-write globally.
              - key: CAS_HARNESS_EVIDENCE_ANCHOR_MODE
                value: disabled
              - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_BUCKET
                sync: false
              - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_PREFIX
                value: cas-harness/accounts-canary/evidence-anchors
              - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_REGION
                value: us-west-2
              - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_OBJECT_LOCK_MODE
                value: GOVERNANCE
              - key: CAS_HARNESS_EVIDENCE_ANCHOR_S3_RETENTION_DAYS
                # One-day buffer above the bucket policy's enforced 30-day
                # minimum avoids a rounding edge at request evaluation time.
                value: "31"
              # Stable server-only HMAC authority for exact-version Object Lock
              # receipts. Keep identical across canary replicas and do not rotate
              # until a receipt-key migration/keyring exists.
              - key: NC_OBJECT_LOCK_RECEIPT_ATTESTATION_KEY
                sync: false
              - key: AWS_ACCESS_KEY_ID
                sync: false
              - key: AWS_SECRET_ACCESS_KEY
                sync: false

              # Live worker access remains server-to-server. Supplying these
              # values is required for the hosted live-audit portion of smoke.
              - key: ATLAS_LIVE_WORKER_URL
                sync: false
              - key: ATLAS_LIVE_WORKER_TOKEN
                sync: false

              # Private-only browser origins; no wildcard and no preview-domain
              # regex. API smoke should normally run from Render Shell/SSH.
              - key: NC_CORS_ORIGINS
                value: https://atlas.noeticcompass.com
              - key: NC_CORS_ORIGIN_REGEX
                value: "^$"

              # Keep model-provider behavior deterministic while validating
              # identity/storage infrastructure. Live CAS traces use the
              # separately authenticated RunPod worker above.
              - key: NC_DEFAULT_LLM_PROVIDER
                value: mock
              - key: NC_MOCK_LLM
                value: "true"
              - key: NC_RATE_LIMIT_TIER
                value: enterprise
              - key: NC_RATE_LIMIT_RPM
                value: "120"
