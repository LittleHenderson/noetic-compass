# v7.6 production-semantics templates — recipes with prerequisites, optional
# leakages, and observed yields per Clarification 9.
#
# State ids encode (noetic, domain) per the cas-native convention:
#   P0..P9 = 0..9, C0..C9 = 10..19, E0..E9 = 20..29, O0..O9 = 30..39.
# So state_id = domain_index * 10 + noetic where domain_index is
# {P:0, C:1, E:2, O:3}.
#
# Each prereq/leakage carries an optional `drive` (1..7) and `register`
# (T/A/f/E) so the emitted CAS expression can render the canonical
# compound state literal `^N^D_{Fk}|R` rather than a `state_N` placeholder
# (the compiler does not admit `state_N` as a primitive). Drive and
# register may be null; when null the state literal is rendered without
# the corresponding annotation.
#
# Pool size note: the directive requires ≥10 unique production recipes.
# We provide 12 archetypes covering all four domains, multiple drive
# axes, both registered and register-neutral compositions, and several
# leakage / catalyst patterns. The generator further diversifies through
# per-example yield noise.

