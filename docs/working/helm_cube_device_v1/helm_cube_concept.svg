<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">HELM Cube concept</title>
  <desc id="d">A matte black cube whose twelve edges glow, the light invisible when off, shown at an angle, beside a front view to scale: a 64 millimetre cube inside a 67 millimetre tennis ball's span.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#17191d"/></linearGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121417"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="rt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1e23"/><stop offset="1" stop-color="#0d0f12"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="420" fill="#0b0c0e"/>
  <!-- angled view -->
  <ellipse cx="200" cy="352" rx="130" ry="18" fill="#000000" opacity="0.55"/>
  <path d="M200 70 L314 136 L200 202 L86 136 Z" fill="url(#top)" stroke="#33373e" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M86 136 L200 202 L200 334 L86 268 Z" fill="url(#lf)" stroke="#23262b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M200 202 L314 136 L314 268 L200 334 Z" fill="url(#rt)" stroke="#2a2d33" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M200 70 L314 136 L200 202 L86 136 Z M86 136 L86 268 L200 334 L314 268 L314 136 M200 202 L200 334" fill="none" stroke="#7fe3ff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M200 70 L314 136 L200 202 L86 136 Z M86 136 L86 268 L200 334 L314 268 L314 136 M200 202 L200 334" fill="none" stroke="#e8fbff" stroke-width="1" stroke-linejoin="round"/>
  <text x="200" y="392" fill="#8b929c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Angled view: light along all twelve edges, no buttons, no visible holes</text>
  <!-- front view with sizes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b929c">
    <circle cx="560" cy="200" r="96" fill="none" stroke="#c9d36a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="560" y="88" text-anchor="middle" fill="#c9d36a">tennis ball, about 67 mm</text>
    <rect x="481" y="121" width="158" height="158" rx="14" fill="none" stroke="#5a606a" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="646" y="128" fill="#5a606a">67 mm</text>
    <rect x="484.5" y="124.5" width="151" height="151" rx="13" fill="#121417" stroke="#33373e" stroke-width="1.2"/>
    <rect x="484.5" y="124.5" width="151" height="151" rx="13" fill="none" stroke="#7fe3ff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="560" y="250" text-anchor="middle">64 mm target, 55 mm stretch</text>
    <text x="560" y="322" text-anchor="middle">Front view to scale: the cube sits inside a tennis ball's span</text>
  </g>
</svg>
