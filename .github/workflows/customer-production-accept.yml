name: Customer Production ACCEPT

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Customer Production Candidate Bundle run ID
        required: true
        type: string
      evidence_artifact_name:
        description: Exact customer-production-candidate-<run-id> artifact name
        required: true
        type: string
      expected_master_head:
        description: Exact protected master HEAD deployed to public production
        required: true
        type: string
      expected_deploy_id:
        description: Exact public Render deployment ID (dep-...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: customer-production-accept
  cancel-in-progress: false

jobs:
  customer_production_accept:
    name: customer-production-accept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: customer-production
    steps:
      - name: Fail closed unless dispatched from protected master in the exact repository
        shell: bash
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REPOSITORY" = "LittleHenderson/noetic-compass"
          test "$DEFAULT_BRANCH" = "master"
          test "$DISPATCH_REF" = "refs/heads/master"
          test "$DISPATCH_REF_PROTECTED" = "true"
          [[ "$EXPECTED_MASTER_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_MASTER_HEAD"
          [[ "$EXPECTED_DEPLOY_ID" =~ ^dep-[A-Za-z0-9]+$ ]]

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_master_head }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bind dispatch inputs to the checked-out protected master and public deployment
        shell: bash
        env:
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MASTER_HEAD"
          [[ "$EXPECTED_MASTER_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEPLOY_ID" =~ ^dep-[A-Za-z0-9]+$ ]]

      - name: Download the signed customer-production evidence bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: .customer-production-evidence
          github-token: ${{ github.token }}
          repository: LittleHenderson/noetic-compass
          run-id: ${{ inputs.evidence_run_id }}

      - name: Require authoritative customer-production ACCEPT
        env:
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
        run: >-
          python scripts/verify_customer_production_acceptance.py
          --manifest .customer-production-evidence/customer-production-acceptance.json
          --evidence-root .customer-production-evidence
          --expected-master-head "$EXPECTED_MASTER_HEAD"
          --expected-deploy-id "$EXPECTED_DEPLOY_ID"
          --live
          --json
          --report-path customer-production-archive/customer-production-acceptance-report.json
          --sanitized-bundle-path customer-production-archive/sanitized-evidence-bundle

      - name: Archive the sanitized evidence bundle and acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: customer-production-acceptance-${{ github.run_id }}
          path: customer-production-archive
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
