name: CAS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blueprint_control:
    name: Render Blueprint control (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the Render Blueprint deployment controls
        run: python scripts/verify_render_blueprint_control.py --offline

      - name: Run the Blueprint control unit tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_verify_render_blueprint_control.py'

      - name: Run the CCB-R1 Stage 0 board conformance lint tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_stage0_lint.py'

      - name: Run the CCB-R1 Stage 1 CJT simulator golden traces
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_cjt_sim.py'

      - name: Run the CCB-R1 Stage 1+4 reasoning core tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_reasoning_core.py'

      - name: Run the CCB-R1 Stage 2+3 fault-injection and firewall-sweep tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_fault_and_sweep.py'

      - name: Run the CCB-R1 baseline controls (B0-B2)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_baselines.py'

      - name: Run the CCB-R1 Stage 5 harness tests (task sets, gate, stats, flips)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_stage5.py'

      - name: Run the CCB-R1 board-side arm and the B4 construct-validity control
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_board.py'

      - name: Run the CCB-R1 Wrap Pipeline arm (wrapped vs bare falsifiability)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_wrap.py'

      - name: Run the CCB-R1 calibration runner tests (keys, prefetch, policy)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_run_calibration.py'

      - name: Run the CCB-R1 Stage 5 comparison runner tests (verdicts must differ)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_run_comparison.py'

      - name: Run the CCB-R1 capability sweep tests (which models can be helped)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_ccb_r1_capability_sweep.py'

      - name: Run the CAS reasoning processor Foundation bank tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_foundations.py'

      - name: Run the CAS reasoning processor workspace tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_workspace.py'

      - name: Run the CAS reasoning processor bank tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_banks.py'

      - name: Run the CAS reasoning processor runtime tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_runtime.py'

      - name: Run the CAS reasoning processor sever-the-cord tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_sever.py'

      - name: Run the CAS reasoning processor console tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_repl.py'

      - name: Run the CAS reasoning processor end to end (no model, no network)
        run: python scripts/cas_rpu/demo.py

      - name: Run the CAS organism tests (persistent session, motivation, heartbeat)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_organism.py'

      - name: Run the controlled-English encoder tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_encoder.py'

      - name: Run the Revision Streams oracle and generator tests (pinned fingerprints)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_revision.py'

      - name: Run the Revision Streams control tests (the oracle minus one rule)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_controls.py'

      - name: Run the Revision Streams ablation tests (the workspace minus one rule)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_ablations.py'

      - name: Run the Revision Streams scoring tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_scoring.py'

      - name: Run the Revision Streams experiment and enforce the contract checks
        run: python scripts/cas_rpu/revision_experiment.py --check --n 80 --quiet

      - name: Run the lasting-memory tests (save, fresh-process restore, retract across restart; level a)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_memory.py'

      - name: Run the record-first tests (a held YES served without a walk, never a stale one)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_record_first.py'

      - name: Run the replacement-machine tests (restore from the second location after the machine is destroyed; live S3 skips without a key)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_replacement.py'

      - name: Run the lesson tests (contract section 13: a told, retractable rule the organism could not apply before)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_lessons.py'

      - name: Run the multi-session harness tests (one fresh process per session; fault schedule; replacement mechanism)
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_session_harness.py'

      - name: Mount the pinned RPA commit read-only (eb99855 of codex/helm-rpa-recorded-run-20260922)
        run: |
          # The RPA path is a comparison column; its tests must RUN in CI, not skip.
          # The commit lives in this repository, so it is fetched by hash and checked
          # out into the path rpa_adapter.DEFAULT_ROOT expects. The adapter refuses
          # any content whose digests differ from the pinned files.
          git fetch --depth 1 origin eb9985566bd11a89f485d627186ef0efa7177f02
          git worktree add --detach .claude/worktrees/rpa-readonly eb9985566bd11a89f485d627186ef0efa7177f02
          chmod -R a-w .claude/worktrees/rpa-readonly || true

      - name: Run the RPA-routing tests (the pinned checkout is mounted, so a skip is a failure)
        env:
          CAS_RPA_REQUIRED: "1"
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cas_rpu_rpa_routing.py'

      - name: Lint the CCB-R1 reference boards (Stage 0 conformance)
        run: |
          # The audited board must stay rejected and the rebuild must stay clean.
          ! python scripts/ccb_r1/stage0_lint.py \
              scripts/ccb_r1/fixtures/ccb_r1_section11_original.board
          python scripts/ccb_r1/stage0_lint.py \
              scripts/ccb_r1/fixtures/ccb_r1_section11_corrected.board

      - name: Validate customer-production contract (OPEN permitted)
        run: python scripts/verify_customer_production_acceptance.py --validate-only

      - name: Run the customer-production acceptance verifier tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_verify_customer_production_acceptance.py'

      - name: Run the claim-honesty machine collector tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_collect_claim_honesty_evidence.py'

      - name: Run the operational acceptance draft collector tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_collect_operational_acceptance_draft.py'

      - name: Run the customer-readiness machine collector tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_collect_customer_readiness_facts.py'

      - name: Run the CAS Compass public-surface contract tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cascompass_landing.py'

      - name: Run the production runtime alert contract tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_production_runtime_alert_contract.py'

      - name: Run the production runtime alert provider adapter tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_production_runtime_alert_delivery.py'

      - name: Run the non-disruptive alert-delivery drill tests
        run: |
          python -m unittest discover -s scripts/tests -p 'test_alert_delivery_drill.py'
          python -m unittest discover -s scripts/tests -p 'test_build_alert_delivery_gate_payload.py'
          python -m unittest discover -s scripts/tests -p 'test_verify_pinned_root_ci_receipt.py'
          python -m unittest discover -s scripts/tests -p 'test_alert_delivery_drill_bootstrap.py'
          python -m unittest discover -s scripts/tests -p 'test_alert_delivery_drill_workflow.py'

      - name: Install the isolated RS256 signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==49.0.0'

      - name: Run the unsigned root-CI collector tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_collect_root_ci_protected_deploy_facts.py'

      - name: Run the root-CI receipt signer tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_sign_root_ci_protected_deploy_receipt.py'

      - name: Run the customer-production candidate assembler tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_assemble_customer_production_acceptance_candidate.py'

  rust_tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noetic-compass-scaffold/noetic-compass/cas-engine/target
          key: ${{ runner.os }}-rust-tests-${{ hashFiles('noetic-compass-scaffold/noetic-compass/cas-engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-tests-

      - name: Run the complete Rust workspace
        working-directory: noetic-compass-scaffold/noetic-compass/cas-engine
        run: cargo test --workspace --locked

  python_tests:
    name: Python API and validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            noetic-compass-scaffold/noetic-compass/requirements.txt
            noetic-compass-scaffold/noetic-compass/cas-engine/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noetic-compass-scaffold/noetic-compass/cas-engine/target
          key: ${{ runner.os }}-python-cargo-${{ hashFiles('noetic-compass-scaffold/noetic-compass/cas-engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-cargo-

      - name: Install API, test, and Rust-extension dependencies
        working-directory: noetic-compass-scaffold/noetic-compass
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            'pytest>=8,<10' \
            'pytest-asyncio>=0.23,<2' \
            'maturin>=1,<2'
          python -m pip install ./cas-engine

      - name: Run the authoritative API and validation suite
        working-directory: noetic-compass-scaffold/noetic-compass
        run: python -m pytest -q

      - name: Run the acceptance-authority alignment tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_acceptance_authority_contract_alignment.py'

  live_trace_worker_tests:
    name: Live trace worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRACE_DEMO_MODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: noetic-compass-scaffold/noetic-compass/live-trace-worker/requirements.txt

      - name: Install CPU worker dependencies
        working-directory: noetic-compass-scaffold/noetic-compass/live-trace-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.4.0'
          python -m pip install \
            -r requirements.txt \
            'pytest>=8,<10' \
            'pytest-asyncio>=0.23,<2'

      - name: Run the worker suite in deterministic demo mode
        working-directory: noetic-compass-scaffold/noetic-compass/live-trace-worker
        run: python -m pytest -q

  atlas_viewer_tests:
    name: Atlas Viewer tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: noetic-compass-scaffold/noetic-compass/atlas-viewer/package-lock.json

      - name: Install Atlas Viewer dependencies
        working-directory: noetic-compass-scaffold/noetic-compass/atlas-viewer
        run: npm ci

      - name: Audit Atlas Viewer production dependencies
        working-directory: noetic-compass-scaffold/noetic-compass/atlas-viewer
        run: npm audit --omit=dev --audit-level=high

      - name: Run Atlas Viewer tests
        working-directory: noetic-compass-scaffold/noetic-compass/atlas-viewer
        run: npm test

      - name: Run Atlas Viewer claim-surface prerender tests
        working-directory: noetic-compass-scaffold/noetic-compass/atlas-viewer
        run: npm run test:claim-surfaces

      - name: Build Atlas Viewer
        working-directory: noetic-compass-scaffold/noetic-compass/atlas-viewer
        run: npm run build

      - name: Build Atlas Viewer with customer accounts enabled
        working-directory: noetic-compass-scaffold/noetic-compass/atlas-viewer
        env:
          VITE_ACCOUNTS_ENABLED: 'true'
        run: npm run build

  dashboard_tests:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: noetic-compass-scaffold/noetic-compass/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npm ci

      - name: Run dashboard tests
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npm test

      - name: Run dashboard claim-surface prerender tests
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npm run test:claim-surfaces

      - name: Build dashboard
        working-directory: noetic-compass-scaffold/noetic-compass/dashboard
        run: npm run build

  api_container_smoke:
    name: Render API dark-config container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Build the production API image
        working-directory: noetic-compass-scaffold/noetic-compass
        run: docker build --file Dockerfile.api --tag noetic-compass-api:ci .

      - name: Start the image with the hosted dark-feature posture
        shell: bash
        run: |
          set -Eeuo pipefail

          container='noetic-compass-api-ci'
          cleanup() {
            status=$?
            trap - EXIT
            if [[ $status -ne 0 ]]; then
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18000:8000 \
            --tmpfs /var/data:rw,size=64m,uid=1000,gid=1000,mode=0700 \
            --env PORT=8000 \
            --env NC_DEBUG=false \
            --env NC_JWT_SECRET=ci-only-jwt-secret-012345678901234567890123456789 \
            --env NC_DEFAULT_LLM_PROVIDER=mock \
            --env NC_MOCK_LLM=true \
            --env NC_STATE_LEDGER_ENABLED=true \
            --env NC_STATE_LEDGER_READ_AUTHORITY=true \
            --env NC_STATE_LEDGER_PATH=/var/data/state_ledger.db \
            --env NC_CRM_LEAD_STORE_PATH=/var/data/leads.jsonl \
            --env CAS_HARNESS_EVIDENCE_PACKET_STORE_DIR=/var/data/evidence_packets \
            --env NC_ACCOUNTS_ENABLED=false \
            --env NC_QUOTAS_ENABLED=false \
            --env NC_BILLING_ENTITLEMENTS_ENABLED=false \
            --env NC_BILLING_PROVIDER=null \
            --env NC_EVIDENCE_PACKET_OBJECT_STORE_ENABLED=false \
            --env NC_FLEET_SERVICE_AUTH_ENABLED=false \
            noetic-compass-api:ci

          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18000/health/ready \
              --output /tmp/noetic-ready.json; then
              ready=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != 'true' ]]; then
              break
            fi
            sleep 2
          done
          [[ $ready -eq 1 ]]

          curl --fail --silent http://127.0.0.1:18000/health \
            --output /tmp/noetic-health.json

          docker exec --interactive "$container" python - <<'PY'
          import importlib.util
          import json
          import os
          import pwd
          import stat
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          import boto3
          import botocore
          import stripe

          from api.config import settings
          from api.services.stripe_billing import (
              STRIPE_API_VERSION,
              STRIPE_SDK_VERSION,
          )

          assert boto3.__version__
          assert botocore.__version__
          # Import-only production-image proof: no Stripe client or provider
          # call is constructed while the billing flags remain dark below.
          assert stripe.VERSION == STRIPE_SDK_VERSION == "15.2.1"
          # The SDK-generated default is older; the adapter explicitly passes
          # the provider-selectable webhook/request revision below.
          assert stripe.api_version == "2026-05-27.dahlia"
          assert STRIPE_API_VERSION == "2026-06-24.dahlia"
          assert settings.state_ledger_enabled is True
          assert settings.state_ledger_read_authority is True
          assert settings.accounts_enabled is False
          assert settings.quotas_enabled is False
          assert settings.billing_entitlements_enabled is False
          assert settings.billing_provider == "null"
          assert settings.billing_reconciliation_enabled is False
          assert settings.evidence_packet_object_store_enabled is False
          assert settings.fleet_service_auth_enabled is False
          assert Path(settings.state_ledger_path).is_file()

          quota_verifier = Path("/app/scripts/verify_account_canary_quotas.py")
          assert quota_verifier.is_file()
          verifier_spec = importlib.util.spec_from_file_location(
              "account_canary_quota_verifier", quota_verifier
          )
          assert verifier_spec is not None and verifier_spec.loader is not None
          verifier_module = importlib.util.module_from_spec(verifier_spec)
          verifier_spec.loader.exec_module(verifier_module)
          assert (
              verifier_module.ACCOUNT_CANARY_SERVICE_ID
              == "srv-d9akoolaeets73bp3e7g"
          )
          assert verifier_module.ACCOUNT_CANARY_QUOTA_LIMIT == 2
          assert verifier_module.ACCOUNT_CANARY_DATABASE_USER == "cas_harness_canary"
          assert (
              verifier_module.ACCOUNT_CANARY_DATABASE_NAME
              == "cas_harness_accounts_canary"
          )
          assert (
              verifier_module.ACCOUNT_CANARY_MODEL_ID
              == "quota-proof-local-no-provider"
          )
          assert (
              verifier_module.ACCOUNT_CANARY_OBJECT_STORE_PREFIX
              == "cas-harness/accounts-canary/evidence-anchors"
          )
          help_result = subprocess.run(
              [sys.executable, str(quota_verifier), "--help"],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert "--expected-service-id" in help_result.stdout
          assert "{pre,post}" in help_result.stdout

          publisher = Path(
              "/app/scripts/publish_customer_production_acceptance_authority.py"
          )
          assert publisher.is_file()
          publisher_help = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "scripts.publish_customer_production_acceptance_authority",
                  "--help",
              ],
              check=True,
              cwd="/app",
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert "{validate,head,publish,deactivate}" in publisher_help.stdout
          publisher_direct_help = subprocess.run(
              [sys.executable, str(publisher), "--help"],
              check=True,
              cwd="/tmp",
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert "{validate,head,publish,deactivate}" in publisher_direct_help.stdout
          publish_help = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "scripts.publish_customer_production_acceptance_authority",
                  "publish",
                  "--help",
              ],
              check=True,
              cwd="/app",
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert "--expected-previous-evidence-sha256" in publish_help.stdout
          assert "--authorization-artifact-uri" in publish_help.stdout
          assert "--authorization-artifact-sha256" in publish_help.stdout
          assert "--operation-reason" in publish_help.stdout
          deactivate_help = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "scripts.publish_customer_production_acceptance_authority",
                  "deactivate",
                  "--help",
              ],
              check=True,
              cwd="/app",
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert "--authorization-artifact-uri" in deactivate_help.stdout
          assert "--authorization-artifact-sha256" in deactivate_help.stdout
          assert "--operation-reason" in deactivate_help.stdout

          crm_collector = Path(
              "/app/scripts/collect_airtable_crm_acceptance_source.py"
          )
          assert crm_collector.is_file()
          crm_collector_help = subprocess.run(
              [sys.executable, str(crm_collector), "--help"],
              check=True,
              cwd="/tmp",
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert "--privacy-notice-version" not in crm_collector_help.stdout
          assert "--master-head" in crm_collector_help.stdout
          assert "--deploy-id" in crm_collector_help.stdout
          assert "--source-receipt-output" in crm_collector_help.stdout
          assert "--fragment-output" in crm_collector_help.stdout

          ssh_directory = Path.home() / ".ssh"
          assert ssh_directory.is_dir()
          assert stat.S_IMODE(ssh_directory.stat().st_mode) == 0o700
          assert pwd.getpwuid(os.getuid()).pw_shell == "/bin/bash"
          assert os.access("/bin/bash", os.X_OK)

          with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5) as response:
              health = json.load(response)
          assert response.status == 200
          assert health["status"] == "ok"

          with urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=5) as response:
              ready = json.load(response)
          assert response.status == 200
          assert ready["status"] == "ok"
          assert ready["checks"]["database"]["status"] == "not_configured"

          with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json", timeout=5) as response:
              paths = json.load(response)["paths"]
          assert "/billing/plans" in paths
          assert "/platform/tenants" in paths
          assert (
              "/api/cas-harness/audit/distributed/session/{audit_id}/fleet/service-credentials"
              in paths
          )
          PY

  required_gate:
    name: cas-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - blueprint_control
      - rust_tests
      - python_tests
      - live_trace_worker_tests
      - atlas_viewer_tests
      - dashboard_tests
      - api_container_smoke
    steps:
      - name: Require every production check to pass
        shell: bash
        run: |
          results=(
            '${{ needs.blueprint_control.result }}'
            '${{ needs.rust_tests.result }}'
            '${{ needs.python_tests.result }}'
            '${{ needs.live_trace_worker_tests.result }}'
            '${{ needs.atlas_viewer_tests.result }}'
            '${{ needs.dashboard_tests.result }}'
            '${{ needs.api_container_smoke.result }}'
          )
          for result in "${results[@]}"; do
            if [[ "$result" != 'success' ]]; then
              echo "Required CI job result: $result" >&2
              exit 1
            fi
          done
          echo 'All required CI jobs passed.'
