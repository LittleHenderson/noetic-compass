name: Render lane value import (temporary)

# One-off migration tool. It reads the lane environment variables that exist only in
# Render's dashboard, stores every one of them under /noetic-compass/render-import/<lane>/
# in AWS Systems Manager, and then promotes the continuity and provider keys into the live
# lane paths.
#
# Deliberately NOT promoted:
#   NC_DATABASE_URL                 - points at Render's database, must stay the AWS RDS URL
#   AWS_ACCESS_KEY_ID/SECRET        - replaced by the instance role on AWS
#   CAS_HARNESS_EVIDENCE_ANCHOR_S3_BUCKET - unchanged bucket, no need to rewrite it
#
# No secret value is printed. GitHub masks every value before anything else runs, and the
# job reports counts and parameter names only.
#
# Both this workflow and the IAM role it assumes are removed once the import is verified.

on:
  push:
    branches: [ops/render-secret-import]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: import-render-lane-values
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assume the narrow import role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::807562639912:role/nc-github-render-import
          aws-region: us-west-2
          role-session-name: render-secret-import

      - name: Import lane values
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo 'RENDER_API_KEY is not configured; nothing to import.'
            exit 1
          fi

          declare -A services=(
            [accounts-off]="srv-d82ph683kofs73d210e0"
            [customer-production]="srv-d9bijbjtqb8s73cn4n20"
            [accounts-canary]="srv-d9akoolaeets73bp3e7g"
          )

          # Keys promoted into the live lane paths. Rationale per group:
          #   receipt/share/pseudonym keys - already-written Object-Locked evidence and
          #     issued share links must keep verifying, so these cannot be regenerated
          #   account/operator secrets      - preserve operator continuity if the Render
          #     database is ever restored
          #   provider credentials          - they exist nowhere else, and restoring them is
          #     the point of this job
          promote_customer=(
            NC_OBJECT_LOCK_RECEIPT_ATTESTATION_KEY
            NC_EVIDENCE_SHARE_TOKEN_PEPPER
            NC_HUMAN_ATTESTATION_PSEUDONYM_ACTIVE_KEY_ID
            NC_HUMAN_ATTESTATION_PSEUDONYM_KEYRING_JSON
            NC_CUSTOMER_PRODUCTION_PSEUDONYM_ACTIVE_KEY_ID
            NC_CUSTOMER_PRODUCTION_PSEUDONYM_KEYRING_JSON
            NC_ACCOUNT_CREDENTIAL_PEPPER
            NC_ACCOUNT_BOOTSTRAP_SECRET
            NC_PLATFORM_TENANT_PROVISIONING_SECRET
            NC_BILLING_ADMIN_SECRET
            NC_AIRTABLE_TOKEN NC_AIRTABLE_BASE_ID NC_AIRTABLE_TABLE_NAME
            NC_AIRTABLE_DEDUP_FIELD NC_AIRTABLE_OWNER_FIELD NC_AIRTABLE_OWNER_VALUE
            NC_AIRTABLE_LIFECYCLE_FIELD NC_CRM_PROVIDER
            ATLAS_LIVE_WORKER_URL ATLAS_LIVE_WORKER_TOKEN
          )
          promote_canary=(
            NC_OBJECT_LOCK_RECEIPT_ATTESTATION_KEY
            NC_EVIDENCE_SHARE_TOKEN_PEPPER
            NC_HUMAN_ATTESTATION_PSEUDONYM_ACTIVE_KEY_ID
            NC_HUMAN_ATTESTATION_PSEUDONYM_KEYRING_JSON
            NC_CUSTOMER_PRODUCTION_PSEUDONYM_ACTIVE_KEY_ID
            NC_CUSTOMER_PRODUCTION_PSEUDONYM_KEYRING_JSON
            NC_ACCOUNT_CREDENTIAL_PEPPER
            NC_ACCOUNT_BOOTSTRAP_SECRET
            NC_PLATFORM_TENANT_PROVISIONING_SECRET
            ATLAS_LIVE_WORKER_URL ATLAS_LIVE_WORKER_TOKEN
          )

          for lane in "${!services[@]}"; do
            id="${services[$lane]}"
            out="/tmp/${lane}.tsv"
            : > "$out"

            cursor=""
            for page in 1 2 3; do
              url="https://api.render.com/v1/services/${id}/env-vars?limit=100"
              [[ -n "$cursor" ]] && url="${url}&cursor=${cursor}"
              curl -sS --fail-with-body \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" "$url" -o "/tmp/${lane}-page${page}.json" \
                || { echo "Render request failed for ${lane} page ${page}"; exit 1; }
              jq -r '.[] | (.envVar // .) | "\(.key)\t\(.value)"' "/tmp/${lane}-page${page}.json" >> "$out"
              cursor="$(jq -r 'if type=="array" and length>0 then (.[-1].cursor // empty) else empty end' "/tmp/${lane}-page${page}.json")"
              [[ -z "$cursor" ]] && break
            done

            count=$(wc -l < "$out" | tr -d ' ')
            echo "::group::${lane}: ${count} variable(s) read"
            while IFS=$'\t' read -r key value; do
              [[ -z "$key" ]] && continue
              echo "::add-mask::${value}"
              aws ssm put-parameter --name "/noetic-compass/render-import/${lane}/${key}" \
                --value "${value}" --type SecureString --overwrite >/dev/null
              printf '  %s\n' "$key"
            done < "$out"
            echo "::endgroup::"
          done

          echo
          echo "=== promoting continuity and provider keys into live lane paths ==="
          promote() {
            local lane="$1"; shift
            local target="$1"; shift
            local promoted=0 skipped=0
            for key in "$@"; do
              if grep -qP "^${key}\t" "/tmp/${lane}.tsv"; then
                value="$(awk -F'\t' -v k="$key" '$1==k {sub(/^[^\t]*\t/,""); print; exit}' "/tmp/${lane}.tsv")"
                echo "::add-mask::${value}"
                aws ssm put-parameter --name "/noetic-compass/${target}/${key}" \
                  --value "${value}" --type SecureString --overwrite >/dev/null
                promoted=$((promoted+1))
              else
                skipped=$((skipped+1))
                echo "  not present in Render: ${key}"
              fi
            done
            echo "${lane} -> ${target}: ${promoted} promoted, ${skipped} absent"
          }

          promote customer-production customer-production "${promote_customer[@]}"
          promote accounts-canary accounts-canary "${promote_canary[@]}"

          echo
          echo "=== names now under the live customer-production path ==="
          aws ssm get-parameters-by-path --path /noetic-compass/customer-production \
            --query 'Parameters[].Name' --output text | tr '\t' '\n' | sed 's|.*/||' | sort
          echo
          echo "=== names now under the live accounts-canary path ==="
          aws ssm get-parameters-by-path --path /noetic-compass/accounts-canary \
            --query 'Parameters[].Name' --output text | tr '\t' '\n' | sed 's|.*/||' | sort
