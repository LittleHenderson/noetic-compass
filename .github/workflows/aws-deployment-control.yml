name: AWS Deployment Control

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-deployment-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: aws-deployment-control-offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify repository AWS deployment controls
        run: python scripts/verify_aws_deployment_control.py --offline

      - name: Run AWS deployment control unit tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_verify_aws_deployment_control.py'

      - name: Run AWS deploy identity tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_aws_deploy_identity.py'

      - name: Run production hostname cutover tests
        run: >-
          python -m unittest discover
          -s scripts/tests
          -p 'test_cutover_production_hostname.py'

  live:
    name: aws-deployment-control-live
    needs: offline
    if: ${{ needs.offline.result == 'success' && github.repository == 'LittleHenderson/noetic-compass' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.NC_AWS_CONTROL_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NC_AWS_CONTROL_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Note an unconfigured optional live check
        if: ${{ env.AWS_ACCESS_KEY_ID == '' }}
        run: echo 'AWS control credentials are not configured; offline policy still passed.'

      - name: Install boto3
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: pip install --quiet 'boto3>=1.34'

      - name: Compare the manifest against the live AWS resources
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: python scripts/verify_aws_deployment_control.py --live
