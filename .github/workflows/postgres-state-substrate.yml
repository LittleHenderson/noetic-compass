name: CAS Postgres State Substrate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres_state_live:
    name: cas-postgres-live-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nc_harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nc_harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/nc_harness_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the live Postgres test dependencies
        working-directory: noetic-compass-scaffold/noetic-compass
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.1,<4.0' 'pytest>=8,<10'

      - name: Verify the driver and service database
        working-directory: noetic-compass-scaffold/noetic-compass
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["NC_TEST_POSTGRES_URL"]) as connection:
              version = connection.execute("select version()").fetchone()[0]
          print("connected:", version)
          PY

      - name: Run the live contract, durability, and fencing suite
        working-directory: noetic-compass-scaffold/noetic-compass
        run: >-
          python -m pytest tests/test_state_substrate_postgres.py
          -q --noconftest -p no:cacheprovider
