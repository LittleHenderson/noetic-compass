name: CAS Production Runtime Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: cas-production-runtime-monitor
  # Never cancel a run before it has had a chance to deliver its alert.
  cancel-in-progress: false

env:
  CAS_PRODUCTION_API_BASE_URL: ${{ vars.CAS_PRODUCTION_API_BASE_URL }}

jobs:
  api_dependency_readiness:
    name: production-api-dependency-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require API, live-worker, and S3 WORM readiness
        run: python scripts/verify_production_runtime_readiness.py --readiness

  worker_realmode:
    name: production-worker-realmode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require real Pythia metadata through the public API proxy
        run: python scripts/verify_production_runtime_readiness.py --worker-realmode

  blueprint_drift:
    name: production-render-blueprint-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require repository and live Render Blueprint controls
        run: python scripts/verify_render_blueprint_control.py --live

  aggregate:
    name: cas-production-runtime-monitor-gate
    if: ${{ always() }}
    needs:
      - api_dependency_readiness
      - worker_realmode
      - blueprint_drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every runtime monitor to pass
        shell: bash
        run: |
          results=(
            '${{ needs.api_dependency_readiness.result }}'
            '${{ needs.worker_realmode.result }}'
            '${{ needs.blueprint_drift.result }}'
          )
          for result in "${results[@]}"; do
            if [[ "$result" != 'success' ]]; then
              echo "Production runtime monitor result: $result" >&2
              exit 1
            fi
          done
          echo 'All production runtime monitors passed.'

  alert_delivery:
    name: cas-production-runtime-alert-delivery
    # Run after failed/skipped dependencies, but honor an explicit workflow cancel.
    if: ${{ !cancelled() }}
    needs:
      - api_dependency_readiness
      - worker_realmode
      - blueprint_drift
      - aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      API_RESULT: ${{ needs.api_dependency_readiness.result }}
      WORKER_RESULT: ${{ needs.worker_realmode.result }}
      BLUEPRINT_RESULT: ${{ needs.blueprint_drift.result }}
      AGGREGATE_RESULT: ${{ needs.aggregate.result }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Deliver or resolve the deduplicated production alert
        id: github_incident
        shell: bash
        run: |
          set -euo pipefail

          alert_label='cas-production-runtime-alert'
          alert_title='CAS production runtime monitor is failing'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          result_summary="api=${API_RESULT} worker=${WORKER_RESULT} blueprint=${BLUEPRINT_RESULT} aggregate=${AGGREGATE_RESULT}"

          gh label create "$alert_label" \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description 'Deduplicated production runtime failure and recovery record' \
            --force

          issue_numbers="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$alert_label" \
            --search "\"${alert_title}\" in:title" \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "CAS production runtime monitor is failing") | .number')"

          issue_number=''
          if [[ -n "$issue_numbers" ]]; then
            if [[ "$issue_numbers" == *$'\n'* ]]; then
              echo 'Multiple open production runtime alert issues exist; refusing an ambiguous update.' >&2
              exit 1
            fi
            if [[ ! "$issue_numbers" =~ ^[0-9]+$ ]]; then
              echo 'Production runtime alert lookup returned an invalid issue identifier.' >&2
              exit 1
            fi
            issue_number="$issue_numbers"
          fi

          if [[ "$AGGREGATE_RESULT" != 'success' ]]; then
            body="Automated production runtime alert. ${result_summary}. Run: ${run_url}. The workflow records only normalized job results and never copies credentials or provider response bodies."
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
              issue_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${issue_number}"
            else
              issue_url="$(gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$alert_title" \
                --label "$alert_label" \
                --body "$body")"
              issue_number="${issue_url##*/}"
              if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
                echo 'Production runtime alert creation returned an invalid issue identifier.' >&2
                exit 1
              fi
            fi

            issue_readback="$(gh issue view "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json createdAt,url,title,labels)"
            issue_created_at="$(jq -r '.createdAt // empty' <<< "$issue_readback")"
            issue_readback_url="$(jq -r '.url // empty' <<< "$issue_readback")"
            issue_readback_title="$(jq -r '.title // empty' <<< "$issue_readback")"
            issue_label_count="$(jq -r '[.labels[].name | select(. == "cas-production-runtime-alert")] | length' <<< "$issue_readback")"
            if [[ ! "$issue_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              echo 'Production runtime alert readback returned an invalid creation time.' >&2
              exit 1
            fi
            if [[ "$issue_readback_url" != "$issue_url" || "$issue_readback_title" != "$alert_title" || "$issue_label_count" != '1' ]]; then
              echo 'Production runtime alert readback did not match its fixed identity.' >&2
              exit 1
            fi
            {
              echo 'alert_state=failing'
              echo "issue_number=${issue_number}"
              echo "issue_created_at_utc=${issue_created_at}"
            } >> "$GITHUB_OUTPUT"
            {
              echo '### Production alert delivered'
              echo "- Issue: ${issue_url}"
              echo "- Results: ${result_summary}"
              echo '- Status: GitHub issue delivery `present`; the customer-production alert-delivery gate and human acknowledgement remain `OPEN` until their separate evidence requirements pass.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$issue_number" ]]; then
            recovery_body="Automated recovery receipt. All runtime monitor jobs passed. Run: ${run_url}."
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$recovery_body"
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
            echo 'alert_state=recovered' >> "$GITHUB_OUTPUT"
            {
              echo '### Production alert resolved'
              echo "- Issue: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${issue_number}"
              echo "- Recovery run: ${run_url}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Production runtime healthy'
              echo "- Run: ${run_url}"
              echo '- No open deduplicated production alert exists.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'alert_state=healthy' >> "$GITHUB_OUTPUT"
          fi

      - name: Deliver configured primary on-call alert and secondary escalation
        if: ${{ steps.github_incident.outputs.alert_state == 'failing' }}
        env:
          CAS_ALERT_PROVIDER_MODE: ${{ vars.CAS_ALERT_PROVIDER_MODE }}
          CAS_ALERT_PRIMARY_WEBHOOK_URL: ${{ secrets.CAS_ALERT_PRIMARY_WEBHOOK_URL }}
          CAS_ALERT_PRIMARY_WEBHOOK_TOKEN: ${{ secrets.CAS_ALERT_PRIMARY_WEBHOOK_TOKEN }}
          CAS_ALERT_ACK_WEBHOOK_URL: ${{ secrets.CAS_ALERT_ACK_WEBHOOK_URL }}
          CAS_ALERT_ACK_WEBHOOK_TOKEN: ${{ secrets.CAS_ALERT_ACK_WEBHOOK_TOKEN }}
          CAS_ALERT_SECONDARY_WEBHOOK_URL: ${{ secrets.CAS_ALERT_SECONDARY_WEBHOOK_URL }}
          CAS_ALERT_SECONDARY_WEBHOOK_TOKEN: ${{ secrets.CAS_ALERT_SECONDARY_WEBHOOK_TOKEN }}
          ALERT_ISSUE_NUMBER: ${{ steps.github_incident.outputs.issue_number }}
          ALERT_EMITTED_AT_UTC: ${{ steps.github_incident.outputs.issue_created_at_utc }}
          SAFE_RECEIPT_PATH: ${{ runner.temp }}/cas-runtime-alert-provider-receipts.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deliver_production_runtime_alert.py \
            --mode "${CAS_ALERT_PROVIDER_MODE:-disabled}" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --issue-number "$ALERT_ISSUE_NUMBER" \
            --emitted-at-utc "$ALERT_EMITTED_AT_UTC" \
            --api-result "$API_RESULT" \
            --worker-result "$WORKER_RESULT" \
            --blueprint-result "$BLUEPRINT_RESULT" \
            --aggregate-result "$AGGREGATE_RESULT" \
            --output "$SAFE_RECEIPT_PATH"

      - name: Preserve secret-safe provider receipt hashes
        if: ${{ always() && steps.github_incident.outputs.alert_state == 'failing' }}
        uses: actions/upload-artifact@v7
        with:
          name: cas-runtime-alert-provider-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cas-runtime-alert-provider-receipts.json
          if-no-files-found: error
          retention-days: 30
