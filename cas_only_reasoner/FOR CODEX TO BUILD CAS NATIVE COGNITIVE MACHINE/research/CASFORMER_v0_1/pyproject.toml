[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casformer-reference"
version = "0.1.0"
description = "Isolated CAS-Ohm-shaped and CJT-inspired Transformer research reference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["casformer"]

[tool.setuptools.package-data]
casformer = ["casformer_trace.schema.json"]

[tool.setuptools.data-files]
"share/casformer-reference" = ["SPEC.md", "CLAIMS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
