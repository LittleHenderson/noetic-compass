# AWS_EXECUTION_MANIFEST -- Gate 1B execution environment (CANDIDATE until the
# owner signs the phase-approval record; NO job may be launched from this file
# without that signature).
# v2 (Gate 1A.1): two-signature gate (CONTAINER_PREP then EXECUTION); every
# identity digest resolved BEFORE the execution signature; generation determinism
# is Python-version-independent (exec/prng.HashPRNG), so the 3.11 container
# regenerates the 3.14-generated candidate corpus byte-identically by
# construction; the launcher's first act is full approval verification.
version: GATE1B_AWS_v2
compute_law:
  rule: "ALL claim-bearing neural work on AWS GPU; NO silent local CPU fallback --
    a job that cannot obtain a GPU fails closed with GPU_REQUIRED"
  bedrock: PROHIBITED for claim-bearing runs (teacher-language only, not used here)
  local_rtx4070: smoke/dev only; never claim-bearing

environment:
  provider: AWS
  preferred: EC2 g5.xlarge (1x A10G 24GB) via a single spot-or-on-demand instance
  fallback: SageMaker training jobs (ml.g5.xlarge) if EC2 G-family quota is 0
  region: us-east-1
  owner_action_required: >
    verify the EC2 G/VT-family vCPU quota (it was 0.0 in a prior campaign) or
    pre-approve the SageMaker fallback; recorded as an unresolved owner decision

container:
  base: python 3.11, torch >= 2.3 (CUDA), transformers pinned at build
  pinning_law: >
    TWO-SIGNATURE GATE (owner audit 2026-08-31 section 3). First the owner signs
    a CONTAINER_PREP approval (OWNER_CONTAINER_PREP_APPROVAL.schema.json), which
    authorizes ONLY: downloading + pinning the model (revision SHA, every weight
    file SHA-256, tokenizer digest), building the container (image digest, pip
    freeze/dependency-lock digest), and constructing + pinning the alternative-
    taxonomy table. Those resolved identities are then written INTO the
    GATE_1B_EXECUTION approval record, which the owner signs SECOND -- so the
    execution signature binds the actual model, container, code, data, controls,
    budget, and destination, with NOTHING deferred past it. The launcher
    re-verifies every identity on-instance and refuses on any mismatch.
  image_digest: RESOLVED_UNDER_CONTAINER_PREP_APPROVAL
  price_note: >
    every $/hour figure in this package is an ESTIMATE, never a signed fact; the
    owner verifies the current instance price and quota in their account at
    approval time, and the launcher takes the verified rate as --hourly-rate-usd

job_definition: >
  a "job" is one atomic entry below; step 6 comprises 25 SEPARATE jobs (one per
  run, ~10 min each) -- the 2-hour per-job wall-clock cap applies to each job as
  defined here, not to a whole step group
job_sequence:
  0: launcher verifies the SIGNED execution approval against the checked-out tree
     (tools/verify_phase_approval.py verify_full -- fields, Ed25519 signature vs
     the pinned key, commit equality, manifest-key-set equality, every digest
     recomputed, untracked scan); ANY defect refuses the whole campaign
  1: dataset regeneration on-instance from seed 20260831 via exec/prng.HashPRNG
     (Python-version-independent BY CONSTRUCTION), written to the NON-FROZEN
     destination results/<campaign_id>/regenerated_dataset/ via
     --output-root (GATE 1A.1R section 3 -- the frozen package tree is NEVER
     mutated during execution; the job also runs generate_construction_gold.py
     --check, which is write-free, against the frozen artifacts); ALL split
     content digests MUST equal the pre-registration; protected MUST equal
     0c0c2842b90b8220782b0ce992ff58dfa035f87228b3dfb63808d9f29bd46321
     under the public-seed derivation (or the owner-side recorded digest under
     the salt derivation) -- else DATASET_INTEGRITY_FAILURE, abort. The runtime
     interpreter/OS/container facts go into the job's runtime receipt, never
     into any frozen manifest
  2: independent round-trip checker re-run over all splits (pinned digest)
  2b: BOTH registered surface baselines recomputed on train/val and REQUIRED to
      equal SURFACE_BASELINES_CANDIDATE.json exactly (B0 floor, B1 ceiling)
  3: alternative-taxonomy table digest re-verified on-instance against the signed
     s7_control_table_sha256 (the table was constructed and pinned under the
     CONTAINER_PREP approval, BEFORE the execution signature)
  3b: model/container/dependency identities re-verified against the signed record
      (MODEL_IDENTITY_MISMATCH / CONTAINER_IDENTITY_MISMATCH on any difference)
  4: activation extraction, 4 candidate layers, train+val, cached to S3 (fp16,
     digest-pinned; cache-once law)
  5: layer selection (S0-only law, seed 11; 4 selection runs)
  6: 25 head-training jobs (8 arms x 3 seeds + the mandated S0/seed-11 duplicate;
     the duplicate performs NO protected read)
  7: protected regeneration + single protected evaluation pass per arm/seed +
     Claim-A probe + protected B0/B1, all inside the same pass
     (exec/protected_eval.py; refuses unless all 25 receipts exist)
  8: deterministic status emission via the COMMITTED tools/emit_gate1_status.py
     with --out results/<campaign_id>/GATE1_STATUS.json (strict evidence
     validation; boot_n frozen at 10000; the status file is written through the
     canonical writer exec/fsio.write_utf8_lf and THAT file's digest is pinned
     in the receipt -- NEVER a shell redirect, whose bytes are
     platform-dependent) + execution receipt + cost report

receipt_fields_per_job:
  [model_revision_sha, weight_file_sha256s, code_commit_sha, dataset_digests,
   container_image_digest, seed, instance_type, region, start, end,
   wall_clock_seconds, output_digests, cost_usd, quota_and_spot_details]

storage:
  s3_prefix: TO_BE_SET_BY_OWNER (bucket + prefix; requires owner account action)
  retention: full receipts and caches retained until the owner archives them

credentials_note: >
  AWS credentials are the owner's (~/.aws/); Claude launches nothing under Gate 1A
  and nothing under Gate 1B until the signed approval exists.
