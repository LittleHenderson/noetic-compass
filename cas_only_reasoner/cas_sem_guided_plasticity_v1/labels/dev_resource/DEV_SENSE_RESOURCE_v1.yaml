# DEV_SENSE_RESOURCE_v1
# DEVELOPMENT-ONLY frozen sense surrogate for the LABEL PHASE 0B pilot.
# NOT claim-bearing. NOT the production resource. It exists so the deterministic label
# pipeline can run offline and reproducibly without a network fetch.
#
# In production, RESOURCE_GOLD draws from a real frozen external resource (WordNet 3.1,
# VerbNet 3.4, FrameNet 1.7) named with exact version + file digest in
# SOURCE_RESOURCE_MANIFEST.json. This DEV surrogate stands in for that resource for the
# pilot only. Every gloss here is authored to be dictionary-like and to contain exactly
# one CAS class's candidate include term (or, for the decoys, to deliberately ABSTAIN).
#
# Each record: sense_id (stable), lemma, pos, gloss (the exact frozen text the verifier
# checks quotes against), source, and optional frame. The `expected_*` fields are the
# author's intent recorded for the pilot audit; the engine ignores them and re-derives the
# label from the gloss against CAS_MAPPING_RULES_v1_CANDIDATE.yaml.

resource_id: DEV_SURROGATE_v1
resource_kind: development_surrogate
claim_bearing: false
note: "Pilot-only. Replace with WordNet/VerbNet/FrameNet frozen digests for any claim-bearing run."

